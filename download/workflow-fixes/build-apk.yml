name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# ─── CONCURRENCY CONTROL ────────────────────────────────────────────────────
# Group all runs by branch. When a new push comes in, cancel any in-progress
# runs for the same branch. This prevents RACE CONDITIONS where two workflow
# runs both try to bump PATCH and push — the second push fails (non-fast-
# forward) and the workflow stops, leaving NO bump commit in the repo.
#
# This was the ROOT CAUSE of the "APK build keeps failing" issue: when two
# commits were pushed in quick succession (e.g. a feature commit + a worklog
# commit 59 seconds later), both workflows tried to `git push` their PATCH
# bump at the same time. One failed, and since the failure was in the bump
# step (before the actual APK build), NO bot commits appeared in the repo —
# making it look like the build silently failed.
#
# cancel-in-progress: true ensures only the LATEST commit's workflow runs.
concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_CONVEX_KEY: ${{ secrets.CONVEX_DEPLOY_KEY != '' }}
      HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
      HAS_VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID != '' }}
      HAS_VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch full history so git pull --rebase works in the bump step
          fetch-depth: 0
          # Use a token with push permission — the default GITHUB_TOKEN has
          # contents:write permission (granted above) so this works.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;36.0.0" "platforms;android-36" "platform-tools"
          echo "Android SDK setup complete."

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Increment patch version (race-safe)
        run: |
          cd android/app
          CURRENT=$(grep '^PATCH=' version.properties | cut -d= -f2)
          NEW=$((CURRENT + 1))
          sed -i "s/^PATCH=.*/PATCH=$NEW/" version.properties
          MAJOR=$(grep '^MAJOR=' version.properties | cut -d= -f2)
          MINOR=$(grep '^MINOR=' version.properties | cut -d= -f2)
          echo "Bumped PATCH from $CURRENT to $NEW → version $MAJOR.$MINOR.$NEW"
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/app/version.properties
          git commit -m "chore: bump patch version to $MAJOR.$MINOR.$NEW [skip ci]" || echo "No changes to commit"

          # ─── RACE-SAFE PUSH ───────────────────────────────────────────
          # Previously: a bare `git push` would fail if another workflow
          # run had pushed a commit in the meantime (non-fast-forward).
          # This caused the ENTIRE workflow to abort before the APK build
          # step — no bump commit appeared in the repo, making it look
          # like a silent failure.
          #
          # FIX: Pull --rebase before push, and retry up to 3 times.
          # The rebase replays our bump commit on top of any commits that
          # landed while we were setting up. The retry handles transient
          # network errors.
          for attempt in 1 2 3; do
            echo "[bump-push] Attempt $attempt: pulling --rebase..."
            if git pull --rebase origin main; then
              echo "[bump-push] Rebase succeeded. Pushing..."
              if git push origin HEAD:main; then
                echo "[bump-push] Push succeeded."
                break
              else
                echo "[bump-push] Push failed (attempt $attempt). Retrying in 5s..."
                sleep 5
              fi
            else
              echo "[bump-push] Pull --rebase failed (attempt $attempt). Retrying in 5s..."
              sleep 5
            fi
            if [ $attempt -eq 3 ]; then
              echo "::error::Failed to push patch bump after 3 attempts. Workflow will continue with local bump."
              # Don't exit 1 — the APK can still build with the locally-bumped version.
              # The next push will re-sync the version.
            fi
          done

      - name: Deploy Convex backend
        if: ${{ env.HAS_CONVEX_KEY == 'true' }}
        continue-on-error: true
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy --cmd "echo 'Convex deployed successfully'"

      - name: Build web app (bundled into APK)
        run: npx vite build

      - name: Sync Capacitor (bundles dist/ into APK)
        run: |
          npx cap sync android
          if [ ! -f android/app/src/main/assets/capacitor.config.json ]; then
            echo "ERROR: cap sync failed — capacitor.config.json not found in assets!"
            exit 1
          fi
          if [ ! -f android/app/src/main/assets/capacitor.plugins.json ]; then
            echo "ERROR: cap sync failed — capacitor.plugins.json not found in assets!"
            exit 1
          fi
          if [ ! -d android/app/src/main/assets/public ]; then
            echo "ERROR: cap sync failed — web assets not copied to assets/public!"
            exit 1
          fi
          echo "✓ Capacitor sync verified:"
          echo "  - capacitor.config.json: present"
          echo "  - capacitor.plugins.json: present"
          echo "  - web assets: $(ls android/app/src/main/assets/public/ | wc -l) files"
          if [ -f android/app/capacitor.build.gradle ]; then
            echo "  - capacitor.build.gradle: present"
          else
            echo "  - capacitor.build.gradle: not found (may be normal)"
          fi

      - name: Build APK (with retry + increased memory)
        working-directory: android
        run: |
          # ─── RETRY LOGIC ──────────────────────────────────────────────
          # Gradle builds can fail transiently due to:
          #   - Network timeouts downloading dependencies
          #   - Daemon crashes
          #   - OOM kills
          # Retry up to 2 times (3 total attempts) before giving up.
          # The `clean` is only run on the first attempt to save time on
          # retries — incremental builds are usually fine after a transient
          # failure.
          ATTEMPT=0
          MAX_ATTEMPTS=3
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "=== APK Build attempt $ATTEMPT/$MAX_ATTEMPTS ==="
            if [ $ATTEMPT -eq 1 ]; then
              # First attempt: clean build for maximum reliability
              ./gradlew clean assembleDebug --no-daemon --stacktrace 2>&1 | tee build-log.txt
            else
              # Retry: skip clean (faster), just re-run assembleDebug
              echo "[retry] Skipping clean — running assembleDebug incrementally..."
              ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build-log-retry-$ATTEMPT.txt
              # Copy retry log to build-log.txt so the failure handler can find it
              cp build-log-retry-$ATTEMPT.txt build-log.txt
            fi
            if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
              echo "✓ APK built successfully on attempt $ATTEMPT"
              break
            fi
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "⚠️ Build attempt $ATTEMPT failed. Retrying in 10s..."
              sleep 10
            fi
          done
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "::error::APK build failed after $MAX_ATTEMPTS attempts — see build-log.txt above for details"
            exit 1
          fi

      - name: Show build output if failed
        if: failure()
        working-directory: android
        run: |
          echo "=== BUILD LOG (last 150 lines) ==="
          tail -150 build-log.txt 2>/dev/null || true
          echo "=== COMPILATION ERRORS (if any) ==="
          grep -i "error:" build-log.txt 2>/dev/null || true
          echo "=== FAILED TASKS (if any) ==="
          grep -i "FAILED\|BUILD FAILED\|FAILURE:" build-log.txt 2>/dev/null || true
          echo "=== AAPT ERRORS (resource issues) ==="
          grep -i "aapt\|resource\|not found" build-log.txt 2>/dev/null || true

      - name: Rename APK with version number
        run: |
          MAJOR=$(grep '^MAJOR=' android/app/version.properties | cut -d= -f2)
          MINOR=$(grep '^MINOR=' android/app/version.properties | cut -d= -f2)
          PATCH=$(grep '^PATCH=' android/app/version.properties | cut -d= -f2)
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Version: $VERSION"
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "android/app/build/outputs/apk/debug/PracticePro-v${VERSION}.apk"
          echo "APK_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Final APK:"
          ls -la android/app/build/outputs/apk/debug/PracticePro-v*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PracticePro-v${{ env.APK_VERSION }}
          path: android/app/build/outputs/apk/debug/PracticePro-v*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish APK as release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/PracticePro-v*.apk
          prerelease: true
          name: PracticePro v${{ env.APK_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version.json with APK release info
        run: |
          APK_URL="https://github.com/R2deetwo/PracticeProVEGA/releases/download/build-${{ github.run_number }}/PracticePro-v${{ env.APK_VERSION }}.apk"
          echo "APK download URL: $APK_URL"
          node -e "
            const fs = require('fs');
            const path = './public/version.json';
            const v = JSON.parse(fs.readFileSync(path, 'utf8'));
            v.apkUrl = process.env.APK_URL;
            v.apkBuildStatus = 'healthy';
            v.apkBuiltAt = new Date().toISOString();
            fs.writeFileSync(path, JSON.stringify(v, null, 2) + '\n');
            console.log('Updated version.json with APK release info:', JSON.stringify({ apkUrl: v.apkUrl, apkBuildStatus: v.apkBuildStatus }));
          "
        env:
          APK_URL: https://github.com/R2deetwo/PracticeProVEGA/releases/download/build-${{ github.run_number }}/PracticePro-v${{ env.APK_VERSION }}.apk

      - name: Commit version.json with APK info (race-safe)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/version.json
          git commit -m "chore: update version.json with APK release info [build-${{ github.run_number }}]" || echo "No changes to commit"
          # Race-safe push (same pattern as the bump step)
          for attempt in 1 2 3; do
            if git pull --rebase origin main; then
              if git push origin HEAD:main; then
                echo "[version-push] Push succeeded."
                break
              fi
            fi
            echo "[version-push] Attempt $attempt failed. Retrying in 5s..."
            sleep 5
          done

      - name: Sync master branch with main (for Vercel native integration)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git push origin origin/main:refs/heads/master --force 2>&1 || true
          echo "✓ master branch synced with main — Vercel native integration will deploy correct code"

      - name: Verify Vercel production deploy is healthy
        if: ${{ env.HAS_VERCEL_TOKEN == 'true' || true }}
        env:
          PRODUCTION_URL: https://practice-pro-vega.vercel.app
        run: |
          echo "=== Verifying Vercel production deploy (read-only) ==="
          echo "Vercel's native GitHub integration deploys automatically on push to master."
          echo "vercel.json's buildCommand marks version.json healthy after a successful build."
          echo ""
          echo "Waiting 90s for native integration to finish deploying..."
          sleep 90

          MAX_WAIT=240
          WAITED=0
          while [ $WAITED -lt $MAX_WAIT ]; do
            RESPONSE=$(curl -s "$PRODUCTION_URL/version.json?_=$(date +%s)" 2>/dev/null || echo "{}")
            STATUS=$(echo "$RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin).get('status','unknown'))" 2>/dev/null || echo "error")
            SHA=$(echo "$RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin).get('sha','unknown')[:8])" 2>/dev/null || echo "error")
            echo "  [${WAITED}s] status=$STATUS sha=$SHA"
            if [ "$STATUS" = "healthy" ]; then
              echo "✅ Production is healthy — version.json status=healthy"
              echo "   Users will see refresh prompts within 1 minute."
              exit 0
            fi
            sleep 15
            WAITED=$((WAITED + 15))
          done

          echo "⚠️  Production version.json not marked healthy after ${MAX_WAIT}s."
          echo "    This may indicate a build failure on Vercel — check:"
          echo "    https://vercel.com/practice-pro-vega/practice-pro-vega/deployments"
          echo "    The native integration will eventually mark it healthy once"
          echo "    the build completes — no action needed from this workflow."
