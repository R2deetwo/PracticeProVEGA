name: Build Product APKs (Vega / Atrium / Komplete)

# ─── BRAND CLARITY PASS, PHASE 2 (Gate B, option 2) ────────────────────────
# Per-product wrapper builds: same web bundle, same applicationId
# (com.practicepro.app — in-place updates for every existing install), only
# the wrapper branding differs (appName, launcher mark, artifact name).
#
# This workflow does NOT bump the version and does NOT touch version.json —
# the universal build (build-apk.yml) remains the version authority and the
# in-app update channel. Product APKs land here as workflow artifacts +
# a pre-release, for the download page / direct sharing.
#
# Manual trigger only (GitHub Actions → Build Product APKs → Run workflow)
# so the default push pipeline stays fast; the founder or an agent runs it
# when a fresh product build is wanted (e.g. after a release).

on:
  workflow_dispatch:
    inputs:
      products:
        description: 'Which product variants to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - vega
          - atrium
          - komplete

concurrency:
  group: product-apks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-product-apks:
    name: Build ${{ inputs.products }} APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;36.0.0" "platforms;android-36" "platform-tools"
          echo "Android SDK setup complete."

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Decode release keystore from secret
        # Same contract as build-apk.yml: without the secret, the product
        # APKs are debug-signed (stable signature, debug channel suffix in
        # the filename). With it, they are release-signed.
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            if [ -s android/app/release.keystore ]; then
              echo "RELEASE_SIGNING=available" >> $GITHUB_ENV
              echo "✓ release.keystore decoded from secret"
            fi
          else
            echo "⚠ RELEASE_KEYSTORE_BASE64 secret not set — product APKs will be debug-signed (-debug suffix)."
            echo "⚠ Setup: docs/brand/BRAND_CLARITY_RUNBOOK.md"
          fi

      - name: Build web app (shared by all variants)
        run: npx vite build

      - name: Build each product variant
        run: |
          set -e
          PRODUCTS="${{ inputs.products }}"
          if [ "$PRODUCTS" = "all" ]; then
            PRODUCTS="vega atrium komplete"
          fi

          VERSION="$(grep '^MAJOR=' android/app/version.properties | cut -d= -f2).$(grep '^MINOR=' android/app/version.properties | cut -d= -f2).$(grep '^PATCH=' android/app/version.properties | cut -d= -f2)"
          echo "Building: $PRODUCTS at v$VERSION"

          if [ "${RELEASE_SIGNING:-}" = "available" ]; then
            GRADLE_TARGET="assembleRelease"
            CHANNEL="release"
          else
            GRADLE_TARGET="assembleDebug"
            CHANNEL="debug"
          fi

          mkdir -p dist-products
          for P in $PRODUCTS; do
            echo "─── $P ───────────────────────────────────────────"
            # The swap script syncs the product wrapper (config, app_name,
            # launcher set) and — in CI — leaves it patched for Gradle.
            node scripts/sync-product-config.cjs --product "$P"

            ( cd android && ./gradlew clean "$GRADLE_TARGET" --no-daemon --stacktrace 2>&1 | tee "../build-$P.log" )

            SRC="android/app/build/outputs/apk/$CHANNEL/app-$CHANNEL.apk"
            if [ ! -f "$SRC" ]; then
              echo "::error::$P build failed — see build-$P.log"
              exit 1
            fi

            OUT="dist-products/$P-$VERSION-$CHANNEL.apk"
            cp "$SRC" "$OUT"
            echo "✓ $OUT"
          done

          echo "PRODUCT_VERSION=$VERSION" >> $GITHUB_ENV
          echo "PRODUCT_CHANNEL=$CHANNEL" >> $GITHUB_ENV
          ls -la dist-products/

      - name: Upload product APKs as artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-apks-v${{ env.PRODUCT_VERSION }}
          path: dist-products/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish product APKs as pre-release assets
        # Public download channel (no GitHub login needed, direct .apk —
        # unlike Actions artifacts, which require a signed-in session and
        # zip-wrap the file). See Brand Clarity audit item A9.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: products-v${{ env.PRODUCT_VERSION }}-${{ github.run_number }}
          files: dist-products/*.apk
          prerelease: true
          name: Product APKs v${{ env.PRODUCT_VERSION }} (${{ env.PRODUCT_CHANNEL }})
          body: |
            Per-product wrapper builds (Vega / Atrium / Komplete).

            - Same applicationId as the universal app — installs as an
              in-place update over any existing PracticePro install.
            - The in-app product experience is identical to the universal
              build; only the wrapper branding differs (home-screen name
              + launcher mark).
            - Channel: ${{ env.PRODUCT_CHANNEL }}

            The universal build and the in-app update prompt
            (`version.json` → `apkUrl`) remain the version authority.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
