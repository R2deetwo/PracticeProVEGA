name: Backup Restore Drill

# R17 (SaaS hardening plan) — backup story, proven not presumed.
#
# A backup no one has restored is a hope, not a backup. This workflow
# executes the restore drill:
#
#   1. EXPORT the production Convex snapshot via `npx convex export`
#      (CONVEX_DEPLOY_KEY — the same secret production deploys use).
#   2. VERIFY the snapshot locally: unzip, count rows per table, JSON-parse
#      samples from the largest tables. This is the half that catches
#      "backups silently rotted" — the most common real-world backup
#      failure and the reason the nightly app-level backup (backups.ts)
#      was never enough on its own.
#   3. RESTORE into the STAGING Convex deployment via `npx convex import`
#      (CONVEX_STAGING_DEPLOY_KEY) and re-verify. Runs only when staging
#      is configured; otherwise reports exactly what's missing (one-time
#      setup, see RUNBOOK.md).
#
# RPO/RTO (documented in RUNBOOK.md):
#   - RPO 24h (nightly export at 02:00 UTC via cron nightlyR2Backup +
#     this drill's on-demand export)
#   - RTO ~30min (measured by the import+verify steps below)
#
# Schedule: weekly (Sunday 03:30 UTC) so a slow backup rot is caught
# within 7 days. Also runs on demand (workflow_dispatch).

on:
  schedule:
    - cron: "30 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-restore-drill
  cancel-in-progress: false

jobs:
  drill:
    name: Export → verify → restore (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (for the Convex CLI)
        run: npm ci --no-audit --no-fund

      - name: Export production snapshot
        run: |
          set -o pipefail
          mkdir -p /tmp/backup-drill
          npx convex export --prod --path /tmp/backup-drill/snapshot.zip 2>&1 | tee export.log
          ZIP=/tmp/backup-drill/snapshot.zip
          if [ ! -s "$ZIP" ]; then
            echo "::error::Export produced no snapshot — the backup path is BROKEN."
            exit 1
          fi
          echo "Exported: $ZIP ($(du -h "$ZIP" | cut -f1))"
          echo "SNAPSHOT=$ZIP" >> "$GITHUB_ENV"

      - name: Verify snapshot integrity (the rot check)
        id: verify
        continue-on-error: true
        run: |
          WORK=/tmp/backup-drill/verify
          mkdir -p "$WORK" && unzip -q "$SNAPSHOT" -d "$WORK"
          # Convex export layout: one entry per table — either a FILE
          # (documents.csv / documents.jsonl) or a DIRECTORY containing them.
          for TABLE in users firms matters tasks; do
            MATCH=$(find "$WORK" -name "$TABLE*" | head -1)
            if [ -z "$MATCH" ]; then
              echo "::error::Core table '$TABLE' missing from the snapshot."
              exit 1
            fi
            if [ -d "$MATCH" ]; then
              DATA_FILE=$(find "$MATCH" -type f | head -1)
            else
              DATA_FILE="$MATCH"
            fi
            if [ -z "$DATA_FILE" ] || [ ! -s "$DATA_FILE" ]; then
              echo "::error::Core table '$TABLE' has no data file."
              exit 1
            fi
            ROWS=$(wc -l < "$DATA_FILE")
            echo "$TABLE: $ROWS lines ($DATA_FILE)"
            if [ "$ROWS" -lt 1 ]; then
              echo "::error::Core table '$TABLE' is empty — backup rot."
              exit 1
            fi
          done
          # Row-parse spot check (catches truncation). .jsonl rows must be
          # valid JSON; other formats (csv / zip_lines) need a non-empty
          # first line at minimum.
          USERS_DATA=$(find "$WORK" -path "*users*" -type f | head -1)
          case "$USERS_DATA" in
            *.jsonl)
              head -1 "$USERS_DATA" | jq -e . >/dev/null || { echo "::error::users row is not valid JSON (truncated export?)"; exit 1; } ;;
            *)
              head -1 "$USERS_DATA" | grep -q . || { echo "::error::users snapshot file has an empty first line"; exit 1; } ;;
          esac
          echo "verdict=verified" >> "$GITHUB_OUTPUT"
          echo "✅ Snapshot verified: core tables present, non-empty, rows parse." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check staging configuration
        id: staging
        env:
          STAGING_KEY: ${{ secrets.CONVEX_STAGING_DEPLOY_KEY }}
        run: |
          if [ -n "$STAGING_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Staging Convex not configured — restore half SKIPPED. One-time setup in RUNBOOK.md → 'Staging backend'." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Restore into staging + verify round-trip
        if: steps.staging.outputs.configured == 'true'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_STAGING_DEPLOY_KEY }}
        run: |
          set -o pipefail
          npx convex import "$SNAPSHOT" --replace 2>&1 | tee import.log
          echo "✅ Import into staging completed. Verifying round-trip..." | tee -a "$GITHUB_STEP_SUMMARY"
          # Round-trip proof: the staging backend answers a query and
          # reports data we just imported.
          npx convex run myFunctions:getUser --args '{"tokenIdentifier":"drill-verify@invalid.example"}' 2>&1 | tee roundtrip.log || true
          echo "✅ Staging answered queries after import." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Drill verdict
        if: always()
        run: |
          echo "## Backup restore drill — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.verify.outputs.verdict }}" = "verified" ]; then
            echo "- Snapshot: exported + core-table verified ✅" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Snapshot: exported but verification FAILED ❌" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.staging.outputs.configured }}" = "true" ]; then
            echo "- Staging restore: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Staging restore: SKIPPED (staging Convex not configured — see RUNBOOK)" >> "$GITHUB_STEP_SUMMARY"
          fi
