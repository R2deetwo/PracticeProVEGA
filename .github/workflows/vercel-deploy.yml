name: Deploy to Vercel

# Independent Vercel deploy — runs on every push to main, in parallel with
# the APK build workflow. This ensures Vercel ALWAYS gets the latest code
# even if the APK build fails (which it often does for unrelated reasons).
#
# This bypasses Vercel's native GitHub integration (which appears to be
# broken — pushes to master weren't triggering auto-deploys).
#
# Requires these GitHub secrets:
#   VERCEL_TOKEN       — Vercel personal access token
#   VERCEL_ORG_ID      — Vercel team/org ID
#   VERCEL_PROJECT_ID  — Vercel project ID

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check required secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "❌ VERCEL_TOKEN secret is not set"
            exit 1
          fi
          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "❌ VERCEL_ORG_ID secret is not set"
            exit 1
          fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "❌ VERCEL_PROJECT_ID secret is not set"
            exit 1
          fi
          echo "✓ All Vercel secrets are set"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project config
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build for Vercel
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel (production)
        run: vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"

      - name: Verify deployment is healthy
        run: |
          echo "Waiting 30s for Vercel to finish deploying..."
          sleep 30

          PRODUCTION_URL="https://practice-pro-vega.vercel.app"
          MAX_WAIT=120
          WAITED=0

          while [ $WAITED -lt $MAX_WAIT ]; do
            RESPONSE=$(curl -s "$PRODUCTION_URL/version.json?_=$(date +%s)" 2>/dev/null || echo "{}")
            STATUS=$(echo "$RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin).get('status','unknown'))" 2>/dev/null || echo "error")
            SHA=$(echo "$RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin).get('sha','unknown')[:8])" 2>/dev/null || echo "error")
            COMMIT_SHA="${{ github.sha }}"
            COMMIT_SHA_SHORT="${COMMIT_SHA:0:8}"

            echo "  [${WAITED}s] status=$STATUS sha=$SHA (expecting $COMMIT_SHA_SHORT)"

            if [ "$STATUS" = "healthy" ] && [ "$SHA" = "$COMMIT_SHA_SHORT" ]; then
              echo "✅ Vercel production is healthy and serving the latest commit ($COMMIT_SHA_SHORT)"
              exit 0
            fi
            sleep 10
            WAITED=$((WAITED + 10))
          done

          echo "⚠️  Vercel deployment not verified after ${MAX_WAIT}s."
          echo "    Current: sha=$SHA status=$STATUS"
          echo "    Expected: sha=$COMMIT_SHA_SHORT"
          echo "    Check: https://vercel.com/practice-pro-vega/practice-pro-vega/deployments"
          exit 1
