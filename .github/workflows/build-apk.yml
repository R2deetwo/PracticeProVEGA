name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Permissions needed for:
#   - contents: write → to commit the version bump back to main
#   - actions: write → to manage workflow runs
permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job-level env — exposes the secret presence as a simple boolean string
    # that step-level `if` conditions can safely reference. GitHub Actions
    # cannot reference `secrets.*` directly in step `if` conditions.
    env:
      HAS_CONVEX_KEY: ${{ secrets.CONVEX_DEPLOY_KEY != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools-version: '36.0.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # ─── Auto-Increment Version Code ───────────────────────────────────
      # Reads android/app/version.properties, increments versionCode by 1,
      # and commits the change back to main so the next build gets the next
      # number. This ensures every APK has a strictly-increasing versionCode,
      # which Android requires to accept an APK as a valid update (instead of
      # "App not installed as package appears to be invalid").
      - name: Increment version code
        run: |
          cd android/app
          CURRENT=$(grep '^versionCode=' version.properties | cut -d= -f2)
          NEW=$((CURRENT + 1))
          sed -i "s/^versionCode=.*/versionCode=$NEW/" version.properties
          # Also bump the versionName patch number for human readability
          CURRENT_NAME=$(grep '^versionName=' version.properties | cut -d= -f2)
          MAJOR=$(echo $CURRENT_NAME | cut -d. -f1)
          MINOR=$(echo $CURRENT_NAME | cut -d. -f2)
          PATCH=$(echo $CURRENT_NAME | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_NAME="$MAJOR.$MINOR.$NEW_PATCH"
          sed -i "s/^versionName=.*/versionName=$NEW_NAME/" version.properties
          echo "Bumped versionCode from $CURRENT to $NEW, versionName from $CURRENT_NAME to $NEW_NAME"
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/app/version.properties
          git commit -m "chore: bump versionCode to $NEW [skip ci]" || echo "No changes to commit"
          git push

      # ─── Convex Backend Deploy ───────────────────────────────────────────
      # Auto-deploys the Convex backend (schema, mutations, queries, crons)
      # on every push to main. Requires the CONVEX_DEPLOY_KEY GitHub secret.
      # If the secret is not set, HAS_CONVEX_KEY is 'false' and this step
      # is skipped (APK still builds).
      - name: Deploy Convex backend
        if: ${{ env.HAS_CONVEX_KEY == 'true' }}
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy --cmd "echo 'Convex deployed successfully'"

      - name: Build web app (bundled into APK)
        run: npx vite build

      - name: Sync Capacitor (bundles dist/ into APK)
        run: npx cap sync android

      - name: Build APK (clean build to purge cached assets)
        working-directory: android
        run: ./gradlew clean assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             android/app/build/outputs/apk/debug/PracticePro.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PracticePro-APK
          path: android/app/build/outputs/apk/debug/PracticePro.apk
          retention-days: 30
          if-no-files-found: error
