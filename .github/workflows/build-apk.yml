name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Permissions needed for:
#   - contents: write → to commit the version bump back to main
#   - actions: write → to manage workflow runs
permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job-level env — exposes the secret presence as a simple boolean string
    # that step-level `if` conditions can safely reference. GitHub Actions
    # cannot reference `secrets.*` directly in step `if` conditions.
    env:
      HAS_CONVEX_KEY: ${{ secrets.CONVEX_DEPLOY_KEY != '' }}
      HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
      HAS_VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID != '' }}
      HAS_VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        # Install API 36 + build-tools 36.0.0 to match the last known
        # working config (June 19, commit 6050c30).
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;36.0.0" "platforms;android-36" "platform-tools"
          echo "Android SDK setup complete."

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # ─── Auto-Increment PATCH Version ──────────────────────────────────
      # Only increments PATCH (bug fixes, small tweaks). MAJOR and MINOR
      # are manually controlled by the developer.
      #
      # Semantic versioning: MAJOR.MINOR.PATCH (e.g., 1.2.3)
      #   MAJOR — manual, fundamental product changes
      #   MINOR — manual, feature releases
      #   PATCH — auto-incremented here on every CI build
      #
      # Android versionCode is computed by build.gradle as:
      #   MAJOR × 10000 + MINOR × 100 + PATCH
      # so it always strictly increases.
      - name: Increment patch version
        run: |
          cd android/app
          CURRENT=$(grep '^PATCH=' version.properties | cut -d= -f2)
          NEW=$((CURRENT + 1))
          sed -i "s/^PATCH=.*/PATCH=$NEW/" version.properties
          MAJOR=$(grep '^MAJOR=' version.properties | cut -d= -f2)
          MINOR=$(grep '^MINOR=' version.properties | cut -d= -f2)
          echo "Bumped PATCH from $CURRENT to $NEW → version $MAJOR.$MINOR.$NEW"
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/app/version.properties
          git commit -m "chore: bump patch version to $MAJOR.$MINOR.$NEW [skip ci]" || echo "No changes to commit"
          git push

      # ─── Convex Backend Deploy ───────────────────────────────────────────
      # Auto-deploys the Convex backend (schema, mutations, queries, crons)
      # on every push to main. Requires the CONVEX_DEPLOY_KEY GitHub secret.
      # If the secret is not set, HAS_CONVEX_KEY is 'false' and this step
      # is skipped (APK still builds).
      #
      # CRITICAL: `continue-on-error: true` ensures that even if the Convex
      # deploy fails (e.g. parse error in a new file, codegen issue), the
      # APK build still proceeds. The APK doesn't depend on Convex being
      # redeployed — it just needs the web assets bundled. Convex can be
      # fixed and redeployed separately without blocking app updates.
      - name: Deploy Convex backend
        if: ${{ env.HAS_CONVEX_KEY == 'true' }}
        continue-on-error: true
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy --cmd "echo 'Convex deployed successfully'"

      - name: Build web app (bundled into APK)
        run: npx vite build

      # ─── Vercel Production Deploy ─────────────────────────────────────────
      # Deploys to the production Vercel project (practice-pro-vega) using the
      # Vercel CLI. This runs IN ADDITION to Vercel's native GitHub integration
      # (which deploys to the dev/preview project) — so every push updates BOTH
      # projects simultaneously.
      #
      # Uses the official Vercel CI/CD pattern:
      #   1. vercel pull  → downloads project settings + env vars
      #   2. vercel build → builds using Vercel's build system
      #   3. vercel deploy --prebuilt → deploys the built output
      #
      # Requires three GitHub secrets:
      #   - VERCEL_TOKEN        → personal access token from vercel.com/account/tokens
      #   - VERCEL_ORG_ID       → team/org ID (team_xxx) from project Settings → General
      #   - VERCEL_PROJECT_ID   → project ID (prj_xxx) of the PRODUCTION project
      #
      # CRITICAL: `continue-on-error: true` ensures the APK build still
      # proceeds even if Vercel deploy fails.
      - name: Deploy to Vercel (production project)
        if: ${{ env.HAS_VERCEL_TOKEN == 'true' && env.HAS_VERCEL_ORG_ID == 'true' && env.HAS_VERCEL_PROJECT_ID == 'true' }}
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "Installing Vercel CLI..."
          npm install -g vercel@latest
          echo ""
          echo "Pulling project settings from Vercel..."
          echo "  ORG_ID:      ${VERCEL_ORG_ID}"
          echo "  PROJECT_ID:  ${VERCEL_PROJECT_ID:0:12}..."
          vercel pull --yes --environment=production --token "${VERCEL_TOKEN}"
          echo ""
          echo "Building project with Vercel..."
          vercel build --prod --token "${VERCEL_TOKEN}"
          echo ""
          echo "Deploying to production..."
          vercel deploy --prebuilt --prod --yes --token "${VERCEL_TOKEN}" 2>&1 | tee vercel-deploy.log
          echo ""
          echo "✓ Vercel production deploy complete"
          DEPLOY_URL=$(grep -oE 'https://[a-z0-9-]+\.vercel\.app' vercel-deploy.log | tail -1 || true)
          if [ -n "$DEPLOY_URL" ]; then
            echo "Production deployment URL: $DEPLOY_URL"
          fi

      - name: Vercel deploy skipped (missing secrets)
        if: ${{ env.HAS_VERCEL_TOKEN != 'true' || env.HAS_VERCEL_ORG_ID != 'true' || env.HAS_VERCEL_PROJECT_ID != 'true' }}
        run: |
          echo "⚠️  Vercel production deploy SKIPPED — missing one or more secrets:"
          echo "  - VERCEL_TOKEN:      ${{ env.HAS_VERCEL_TOKEN == 'true' && 'set' || 'MISSING' }}"
          echo "  - VERCEL_ORG_ID:     ${{ env.HAS_VERCEL_ORG_ID == 'true' && 'set' || 'MISSING' }}"
          echo "  - VERCEL_PROJECT_ID: ${{ env.HAS_VERCEL_PROJECT_ID == 'true' && 'set' || 'MISSING' }}"
          echo ""
          echo "Add them at: https://github.com/R2deetwo/PracticeProVEGA/settings/secrets/actions"

      # ─── Build Health Verification + version.json Update ────────────────
      # After the Vercel deploy, run a smoke test against the production URL.
      # Only if the smoke test passes do we mark the build as 'healthy' in
      # version.json. This prevents users from being prompted to refresh to
      # a broken build.
      #
      # The smoke test:
      #   1. Fetches the production URL
      #   2. Verifies HTTP 200
      #   3. Checks the HTML contains expected markers (title, root div)
      #   4. Checks that the main JS bundle is referenced and fetchable
      #
      # If the smoke test fails, version.json stays at status='building'
      # and users are NOT prompted to refresh. A subsequent fix push will
      # overwrite it.
      - name: Smoke test production + mark build healthy
        if: ${{ env.HAS_VERCEL_TOKEN == 'true' && env.HAS_VERCEL_ORG_ID == 'true' && env.HAS_VERCEL_PROJECT_ID == 'true' }}
        continue-on-error: true
        env:
          PRODUCTION_URL: https://practice-pro-vega.vercel.app
        run: |
          echo "Waiting 10s for Vercel deploy to propagate..."
          sleep 10

          echo "Running smoke test against $PRODUCTION_URL..."

          # 1. Fetch the production HTML
          HTTP_STATUS=$(curl -s -o /tmp/prod_smoke.html -w "%{http_code}" "$PRODUCTION_URL" || echo "000")
          echo "  HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ SMOKE TEST FAILED: production URL returned $HTTP_STATUS"
            echo "   version.json remains at status='building' — users will NOT be prompted to refresh"
            exit 0
          fi

          # 2. Check for expected HTML markers
          if ! grep -q "PracticePro" /tmp/prod_smoke.html; then
            echo "❌ SMOKE TEST FAILED: HTML does not contain 'PracticePro'"
            exit 0
          fi
          if ! grep -q 'id="root"' /tmp/prod_smoke.html; then
            echo "❌ SMOKE TEST FAILED: HTML does not contain root div"
            exit 0
          fi

          # 3. Check that the main JS bundle is referenced and fetchable
          JS_BUNDLE=$(grep -oE '/assets/index-[a-zA-Z0-9_-]+\.js' /tmp/prod_smoke.html | head -1 || true)
          if [ -z "$JS_BUNDLE" ]; then
            echo "❌ SMOKE TEST FAILED: no JS bundle reference found in HTML"
            exit 0
          fi
          echo "  JS bundle: $JS_BUNDLE"

          JS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PRODUCTION_URL$JS_BUNDLE" || echo "000")
          echo "  JS bundle HTTP status: $JS_STATUS"
          if [ "$JS_STATUS" != "200" ]; then
            echo "❌ SMOKE TEST FAILED: JS bundle returned $JS_STATUS"
            exit 0
          fi

          # 4. Check version.json is served
          VERSION_STATUS=$(curl -s -o /tmp/version_smoke.json -w "%{http_code}" "$PRODUCTION_URL/version.json" || echo "000")
          echo "  version.json HTTP status: $VERSION_STATUS"
          if [ "$VERSION_STATUS" != "200" ]; then
            echo "❌ SMOKE TEST FAILED: version.json returned $VERSION_STATUS"
            exit 0
          fi

          echo ""
          echo "✅ SMOKE TEST PASSED — marking build as healthy"

          # Update version.json to status='healthy' with stableSince timestamp.
          # This is what tells the client it's safe to prompt users to refresh.
          node -e "
            const fs = require('fs');
            const path = require('path');
            const v = JSON.parse(fs.readFileSync('public/version.json', 'utf8'));
            v.status = 'healthy';
            v.stableSince = new Date().toISOString();
            fs.writeFileSync('public/version.json', JSON.stringify(v, null, 2) + '\n');
            console.log('Updated version.json:', JSON.stringify(v, null, 2));
          "

          # ─── Copy updated version.json into the Vercel build output ──────
          # CRITICAL: `vercel deploy --prebuilt` uses the .vercel/output/
          # directory that was built BEFORE the smoke test ran. The updated
          # version.json in public/ is NOT in the build output yet, so we
          # must copy it into .vercel/output/static/ before redeploying.
          # Without this, the deployed version.json stays at status="building"
          # and the refresh floater never shows.
          if [ -d '.vercel/output/static' ]; then
            echo "Copying updated version.json into .vercel/output/static/"
            cp public/version.json .vercel/output/static/version.json
            echo "✓ version.json copied to build output"
          else
            echo "⚠️  .vercel/output/static/ not found — trying alternate paths"
            # If the output structure is different, try .vercel/output/public/
            if [ -d '.vercel/output/public' ]; then
              cp public/version.json .vercel/output/public/version.json
            fi
          fi

          # Re-deploy with the updated build output (now containing healthy version.json)
          if [ -d '.vercel' ]; then
            echo "Re-deploying with healthy version.json..."
            vercel deploy --prod --yes --prebuilt --token "${{ secrets.VERCEL_TOKEN }}" 2>&1 | tee redeploy.log | tail -5 || true
            # Verify the deployed version.json is now healthy
            DEPLOY_URL=$(grep -oE 'https://[a-z0-9-]+\.vercel\.app' redeploy.log | tail -1 || true)
            if [ -n "$DEPLOY_URL" ]; then
              echo "Verifying deployed version.json..."
              sleep 5
              DEPLOYED_STATUS=$(curl -s "$DEPLOY_URL/version.json" | python3 -c "import json,sys; print(json.load(sys.stdin).get('status','unknown'))" 2>/dev/null || echo "error")
              echo "  Deployed version.json status: $DEPLOYED_STATUS"
              if [ "$DEPLOYED_STATUS" = "healthy" ]; then
                echo "✓ version.json successfully marked healthy on production"
              else
                echo "⚠️  version.json still shows status=$DEPLOYED_STATUS — users may not see refresh prompt yet"
              fi
            fi
          fi

          echo ""
          echo "✓ Build marked healthy. Users will be prompted to refresh after 5-min stable delay."

      - name: Sync Capacitor (bundles dist/ into APK)
        run: |
          npx cap sync android
          # Verify cap sync actually worked
          if [ ! -f android/app/src/main/assets/capacitor.config.json ]; then
            echo "ERROR: cap sync failed — capacitor.config.json not found in assets!"
            exit 1
          fi
          if [ ! -f android/app/src/main/assets/capacitor.plugins.json ]; then
            echo "ERROR: cap sync failed — capacitor.plugins.json not found in assets!"
            exit 1
          fi
          if [ ! -d android/app/src/main/assets/public ]; then
            echo "ERROR: cap sync failed — web assets not copied to assets/public!"
            exit 1
          fi
          echo "✓ Capacitor sync verified:"
          echo "  - capacitor.config.json: present"
          echo "  - capacitor.plugins.json: present"
          echo "  - web assets: $(ls android/app/src/main/assets/public/ | wc -l) files"
          # Check for capacitor.build.gradle (generated by cap sync)
          if [ -f android/app/capacitor.build.gradle ]; then
            echo "  - capacitor.build.gradle: present"
          else
            echo "  - capacitor.build.gradle: not found (may be normal)"
          fi

      - name: Build APK (clean build)
        working-directory: android
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Show build output if failed
        if: failure()
        working-directory: android
        run: cat build-log.txt 2>/dev/null || true

      - name: Rename APK with version number
        run: |
          MAJOR=$(grep '^MAJOR=' android/app/version.properties | cut -d= -f2)
          MINOR=$(grep '^MINOR=' android/app/version.properties | cut -d= -f2)
          PATCH=$(grep '^PATCH=' android/app/version.properties | cut -d= -f2)
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Version: $VERSION"
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "android/app/build/outputs/apk/debug/PracticePro-v${VERSION}.apk"
          echo "APK_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Final APK:"
          ls -la android/app/build/outputs/apk/debug/PracticePro-v*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PracticePro-v${{ env.APK_VERSION }}
          path: android/app/build/outputs/apk/debug/PracticePro-v*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish APK as release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/PracticePro-v*.apk
          prerelease: true
          name: PracticePro v${{ env.APK_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
