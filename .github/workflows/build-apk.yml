name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Permissions needed for:
#   - contents: write → to commit the version bump back to main
#   - actions: write → to manage workflow runs
permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job-level env — exposes the secret presence as a simple boolean string
    # that step-level `if` conditions can safely reference. GitHub Actions
    # cannot reference `secrets.*` directly in step `if` conditions.
    env:
      HAS_CONVEX_KEY: ${{ secrets.CONVEX_DEPLOY_KEY != '' }}
      HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
      HAS_VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID != '' }}
      HAS_VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        # Install API 36 + build-tools 36.0.0 to match the last known
        # working config (June 19, commit 6050c30).
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;36.0.0" "platforms;android-36" "platform-tools"
          echo "Android SDK setup complete."

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # ─── Auto-Increment PATCH Version ──────────────────────────────────
      # Only increments PATCH (bug fixes, small tweaks). MAJOR and MINOR
      # are manually controlled by the developer.
      #
      # Semantic versioning: MAJOR.MINOR.PATCH (e.g., 1.2.3)
      #   MAJOR — manual, fundamental product changes
      #   MINOR — manual, feature releases
      #   PATCH — auto-incremented here on every CI build
      #
      # Android versionCode is computed by build.gradle as:
      #   MAJOR × 10000 + MINOR × 100 + PATCH
      # so it always strictly increases.
      - name: Increment patch version
        run: |
          cd android/app
          CURRENT=$(grep '^PATCH=' version.properties | cut -d= -f2)
          NEW=$((CURRENT + 1))
          sed -i "s/^PATCH=.*/PATCH=$NEW/" version.properties
          MAJOR=$(grep '^MAJOR=' version.properties | cut -d= -f2)
          MINOR=$(grep '^MINOR=' version.properties | cut -d= -f2)
          echo "Bumped PATCH from $CURRENT to $NEW → version $MAJOR.$MINOR.$NEW"
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/app/version.properties
          git commit -m "chore: bump patch version to $MAJOR.$MINOR.$NEW [skip ci]" || echo "No changes to commit"
          git push

      # ─── Convex Backend Deploy ───────────────────────────────────────────
      # Auto-deploys the Convex backend (schema, mutations, queries, crons)
      # on every push to main. Requires the CONVEX_DEPLOY_KEY GitHub secret.
      # If the secret is not set, HAS_CONVEX_KEY is 'false' and this step
      # is skipped (APK still builds).
      #
      # CRITICAL: `continue-on-error: true` ensures that even if the Convex
      # deploy fails (e.g. parse error in a new file, codegen issue), the
      # APK build still proceeds. The APK doesn't depend on Convex being
      # redeployed — it just needs the web assets bundled. Convex can be
      # fixed and redeployed separately without blocking app updates.
      - name: Deploy Convex backend
        if: ${{ env.HAS_CONVEX_KEY == 'true' }}
        continue-on-error: true
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy --cmd "echo 'Convex deployed successfully'"

      - name: Build web app (bundled into APK)
        run: npx vite build

      # NOTE: Vercel CLI deploy has been REMOVED. The Vercel native GitHub
      # integration handles production deploys automatically. vercel.json's
      # buildCommand ("npm run build && node scripts/mark-healthy.cjs")
      # atomically marks version.json as 'healthy' after a successful build.
      # This eliminates the previous race condition where the CLI deploy
      # would silently fail (continue-on-error: true) and leave version.json
      # stuck at "building" status forever.

      - name: Sync Capacitor (bundles dist/ into APK)
        run: |
          npx cap sync android
          # Verify cap sync actually worked
          if [ ! -f android/app/src/main/assets/capacitor.config.json ]; then
            echo "ERROR: cap sync failed — capacitor.config.json not found in assets!"
            exit 1
          fi
          if [ ! -f android/app/src/main/assets/capacitor.plugins.json ]; then
            echo "ERROR: cap sync failed — capacitor.plugins.json not found in assets!"
            exit 1
          fi
          if [ ! -d android/app/src/main/assets/public ]; then
            echo "ERROR: cap sync failed — web assets not copied to assets/public!"
            exit 1
          fi
          echo "✓ Capacitor sync verified:"
          echo "  - capacitor.config.json: present"
          echo "  - capacitor.plugins.json: present"
          echo "  - web assets: $(ls android/app/src/main/assets/public/ | wc -l) files"
          # Check for capacitor.build.gradle (generated by cap sync)
          if [ -f android/app/capacitor.build.gradle ]; then
            echo "  - capacitor.build.gradle: present"
          else
            echo "  - capacitor.build.gradle: not found (may be normal)"
          fi

      - name: Build APK (clean build)
        working-directory: android
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Show build output if failed
        if: failure()
        working-directory: android
        run: cat build-log.txt 2>/dev/null || true

      - name: Rename APK with version number
        run: |
          MAJOR=$(grep '^MAJOR=' android/app/version.properties | cut -d= -f2)
          MINOR=$(grep '^MINOR=' android/app/version.properties | cut -d= -f2)
          PATCH=$(grep '^PATCH=' android/app/version.properties | cut -d= -f2)
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Version: $VERSION"
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "android/app/build/outputs/apk/debug/PracticePro-v${VERSION}.apk"
          echo "APK_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Final APK:"
          ls -la android/app/build/outputs/apk/debug/PracticePro-v*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PracticePro-v${{ env.APK_VERSION }}
          path: android/app/build/outputs/apk/debug/PracticePro-v*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish APK as release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/PracticePro-v*.apk
          prerelease: true
          name: PracticePro v${{ env.APK_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ═════════════════════════════════════════════════════════════════════
      # SYNC MASTER BRANCH — Vercel's native GitHub integration deploys
      # from the "master" branch, but our repo uses "main". We force-push
      # main → master so Vercel's native integration deploys the correct
      # code automatically.
      # ═════════════════════════════════════════════════════════════════════
      - name: Sync master branch with main (for Vercel native integration)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Fetch latest main ref so origin/main is up to date in this clone
          git fetch origin main
          # Force-push main → master so Vercel native integration always
          # deploys the exact same commit as main (no drift, no lag).
          git push origin origin/main:refs/heads/master --force 2>&1 || true
          echo "✓ master branch synced with main — Vercel native integration will deploy correct code"

      # ═════════════════════════════════════════════════════════════════════
      # VERIFY VERCEL DEPLOY (read-only check — no second deploy)
      # ----------------------------------------------------------------
      # The Vercel native GitHub integration handles the actual deploy.
      # It runs vercel.json's buildCommand:
      #   "npm run build && node scripts/mark-healthy.cjs"
      # which atomically marks version.json as 'healthy' after a successful
      # build. No second CLI deploy, no race condition, no silent failures.
      #
      # This step just waits and verifies that production came up healthy.
      # It does NOT push another deploy — that was the source of the old
      # race condition that left version.json stuck at "building".
      # ═════════════════════════════════════════════════════════════════════
      - name: Verify Vercel production deploy is healthy
        if: ${{ env.HAS_VERCEL_TOKEN == 'true' || true }}
        env:
          PRODUCTION_URL: https://practice-pro-vega.vercel.app
        run: |
          echo "=== Verifying Vercel production deploy (read-only) ==="
          echo "Vercel's native GitHub integration deploys automatically on push to master."
          echo "vercel.json's buildCommand marks version.json healthy after a successful build."
          echo ""
          echo "Waiting 90s for native integration to finish deploying..."
          sleep 90

          # Poll version.json for up to 4 minutes waiting for status=healthy
          MAX_WAIT=240  # 4 minutes
          WAITED=0
          while [ $WAITED -lt $MAX_WAIT ]; do
            RESPONSE=$(curl -s "$PRODUCTION_URL/version.json?_=$(date +%s)" 2>/dev/null || echo "{}")
            STATUS=$(echo "$RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin).get('status','unknown'))" 2>/dev/null || echo "error")
            SHA=$(echo "$RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin).get('sha','unknown')[:8])" 2>/dev/null || echo "error")
            echo "  [${WAITED}s] status=$STATUS sha=$SHA"
            if [ "$STATUS" = "healthy" ]; then
              echo "✅ Production is healthy — version.json status=healthy"
              echo "   Users will see refresh prompts within 1 minute."
              exit 0
            fi
            sleep 15
            WAITED=$((WAITED + 15))
          done

          echo "⚠️  Production version.json not marked healthy after ${MAX_WAIT}s."
          echo "    This may indicate a build failure on Vercel — check:"
          echo "    https://vercel.com/practice-pro-vega/practice-pro-vega/deployments"
          echo "    The native integration will eventually mark it healthy once"
          echo "    the build completes — no action needed from this workflow."
          # Don't fail the workflow — the APK build still succeeded.
