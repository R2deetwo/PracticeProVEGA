name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# ─── CONCURRENCY CONTROL ────────────────────────────────────────────────────
# Group all runs by branch. When a new push comes in, cancel any in-progress
# runs for the same branch. This prevents RACE CONDITIONS where two workflow
# runs both try to bump PATCH and push — the second push fails (non-fast-
# forward) and the workflow stops, leaving NO bump commit in the repo.
#
# This was the ROOT CAUSE of the "APK build keeps failing" issue: when two
# commits were pushed in quick succession (e.g. a feature commit + a worklog
# commit 59 seconds later), both workflows tried to `git push` their PATCH
# bump at the same time. One failed, and since the failure was in the bump
# step (before the actual APK build), NO bot commits appeared in the repo —
# making it look like the build silently failed.
#
# cancel-in-progress: true ensures only the LATEST commit's workflow runs.
concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  # Round 10: the APK bundles the frontend users install — it must pass
  # the same quality gate as every deploy. Tests fail → no APK build.
  quality-gate:
    name: Typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ERROR_BASELINE: "94"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck Convex backend (deploy gate — must be 0 errors)
        run: |
          if npx tsc -p convex --noEmit; then
            echo "✅ Convex typecheck clean (0 errors)"
          else
            echo "::error::convex/ typecheck FAILED — npx convex deploy will reject this code. Fix before pushing."
            exit 1
          fi

      - name: Typecheck app (baseline-guarded)
        run: |
          set +e
          npx tsc --noEmit 2>&1 | tee /tmp/root-tsc.log | tail -3
          ERRORS=$(grep -c "error TS" /tmp/root-tsc.log)
          set -e
          echo "Root tsc errors: $ERRORS (baseline: $ERROR_BASELINE)"
          if [ "$ERRORS" -gt "$ERROR_BASELINE" ]; then
            echo "::error::Root tsc error count ($ERRORS) exceeds baseline ($ERROR_BASELINE) — new type errors introduced."
            exit 1
          fi

      - name: Run unit test suite
        run: npx vitest run

  build:
    name: Build APK
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
      HAS_VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID != '' }}
      HAS_VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch full history so git pull --rebase works in the bump step
          fetch-depth: 0
          # Use a token with push permission — the default GITHUB_TOKEN has
          # contents:write permission (granted above) so this works.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;36.0.0" "platforms;android-36" "platform-tools"
          echo "Android SDK setup complete."

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate debug.keystore if missing
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            echo "debug.keystore not found — generating with standard Android debug credentials..."
            keytool -genkeypair \
              -keystore android/app/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -storetype PKCS12
            echo "✓ debug.keystore generated"
          else
            echo "✓ debug.keystore already exists"
          fi

      - name: Decode release keystore from secret (Brand Clarity A5)
        # ─── STABLE RELEASE SIGNING ────────────────────────────────────
        # The old step generated a NEW random release.keystore on every
        # ephemeral CI run — every build would have carried a different
        # signature, so Android would reject in-app updates (INSTALL_FAILED_
        # UPDATE_INCOMPATIBLE). The keystore now lives ONLY as the base64
        # GitHub secret RELEASE_KEYSTORE_BASE64 (plus RELEASE_STORE_PASSWORD
        # and RELEASE_KEY_PASSWORD, which already exist).
        #
        # One-time setup is documented in docs/brand/BRAND_CLARITY_RUNBOOK.md.
        # Until the secret exists, the workflow keeps distributing the DEBUG
        # build (its signature is stable — debug.keystore is deliberately
        # committed) so the update channel never breaks, and warns loudly.
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            if [ -s android/app/release.keystore ]; then
              echo "RELEASE_SIGNING=available" >> $GITHUB_ENV
              echo "✓ release.keystore decoded from secret — release builds will be release-signed"
            else
              echo "⚠ RELEASE_KEYSTORE_BASE64 decoded to an empty file — check the secret. Falling back to debug distribution."
            fi
          else
            echo "⚠ RELEASE_KEYSTORE_BASE64 secret not set."
            echo "⚠ The distribution APK will be the DEBUG build (stable signature, but debuggable)."
            echo "⚠ Set up the secret per docs/brand/BRAND_CLARITY_RUNBOOK.md to ship release-signed builds."
          fi

      - name: Increment patch version (race-safe)
        run: |
          cd android/app
          CURRENT=$(grep '^PATCH=' version.properties | cut -d= -f2)
          NEW=$((CURRENT + 1))
          sed -i "s/^PATCH=.*/PATCH=$NEW/" version.properties
          MAJOR=$(grep '^MAJOR=' version.properties | cut -d= -f2)
          MINOR=$(grep '^MINOR=' version.properties | cut -d= -f2)
          echo "Bumped PATCH from $CURRENT to $NEW → version $MAJOR.$MINOR.$NEW"
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/app/version.properties
          git commit -m "chore: bump patch version to $MAJOR.$MINOR.$NEW [skip ci]" || echo "No changes to commit"

          # ─── RACE-SAFE PUSH ───────────────────────────────────────────
          # Previously: a bare `git push` would fail if another workflow
          # run had pushed a commit in the meantime (non-fast-forward).
          # This caused the ENTIRE workflow to abort before the APK build
          # step — no bump commit appeared in the repo, making it look
          # like a silent failure.
          #
          # FIX: Pull --rebase before push, and retry up to 3 times.
          # The rebase replays our bump commit on top of any commits that
          # landed while we were setting up. The retry handles transient
          # network errors.
          for attempt in 1 2 3; do
            echo "[bump-push] Attempt $attempt: pulling --rebase..."
            if git pull --rebase --autostash origin main; then
              echo "[bump-push] Rebase succeeded. Pushing..."
              if git push origin HEAD:main; then
                echo "[bump-push] Push succeeded."
                break
              else
                echo "[bump-push] Push failed (attempt $attempt). Retrying in 5s..."
                sleep 5
              fi
            else
              echo "[bump-push] Pull --rebase failed (attempt $attempt). Retrying in 5s..."
              sleep 5
            fi
            if [ $attempt -eq 3 ]; then
              echo "::error::Failed to push patch bump after 3 attempts. Workflow will continue with local bump."
              # Don't exit 1 — the APK can still build with the locally-bumped version.
              # The next push will re-sync the version.
            fi
          done

      # Round 10: the Convex deploy step that used to live here was moved
      # to .github/workflows/convex-deploy.yml — its own workflow, gated on
      # the Tests workflow, with continue-on-error REMOVED. The old step
      # silently swallowed deploy failures (Round 6 root cause) and buried
      # the backend deploy inside an Android build job.

      - name: Build web app (bundled into APK)
        run: npx vite build

      - name: Sync Capacitor (bundles dist/ into APK)
        run: |
          npx cap sync android
          if [ ! -f android/app/src/main/assets/capacitor.config.json ]; then
            echo "ERROR: cap sync failed — capacitor.config.json not found in assets!"
            exit 1
          fi
          if [ ! -f android/app/src/main/assets/capacitor.plugins.json ]; then
            echo "ERROR: cap sync failed — capacitor.plugins.json not found in assets!"
            exit 1
          fi
          if [ ! -d android/app/src/main/assets/public ]; then
            echo "ERROR: cap sync failed — web assets not copied to assets/public!"
            exit 1
          fi
          echo "✓ Capacitor sync verified:"
          echo "  - capacitor.config.json: present"
          echo "  - capacitor.plugins.json: present"
          echo "  - web assets: $(ls android/app/src/main/assets/public/ | wc -l) files"
          if [ -f android/app/capacitor.build.gradle ]; then
            echo "  - capacitor.build.gradle: present"
          else
            echo "  - capacitor.build.gradle: not found (may be normal)"
          fi

      - name: Build APK (debug smoke + release distribution, with retry)
        working-directory: android
        run: |
          # ─── WHAT GETS BUILT ──────────────────────────────────────────
          # assembleDebug — the fast smoke build; also the FALLBACK
          #   distribution artifact while RELEASE_KEYSTORE_BASE64 is unset
          #   (its signature is stable because debug.keystore is committed).
          # assembleRelease — the DISTRIBUTION build, only when the release
          #   keystore secret was decoded (Brand Clarity audit A4: the
          #   published APK must not be a debuggable debug build).
          build_targets="assembleDebug"
          if [ "${RELEASE_SIGNING:-}" = "available" ]; then
            build_targets="assembleDebug assembleRelease"
          fi
          echo "Building: $build_targets"

          # ─── RETRY LOGIC (unchanged behaviour) ───────────────────────
          # Gradle builds can fail transiently (network, daemon crashes,
          # OOM). Retry up to 2 times (3 total attempts). The `clean` only
          # runs on the first attempt to save time on retries.
          ATTEMPT=0
          MAX_ATTEMPTS=3
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "=== APK Build attempt $ATTEMPT/$MAX_ATTEMPTS ==="
            if [ $ATTEMPT -eq 1 ]; then
              ./gradlew clean $build_targets --no-daemon --stacktrace 2>&1 | tee build-log.txt
            else
              echo "[retry] Skipping clean — building incrementally..."
              ./gradlew $build_targets --no-daemon --stacktrace 2>&1 | tee build-log-retry-$ATTEMPT.txt
              cp build-log-retry-$ATTEMPT.txt build-log.txt
            fi
            if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
              if [ "${RELEASE_SIGNING:-}" != "available" ] || [ -f app/build/outputs/apk/release/app-release.apk ]; then
                echo "✓ APK targets built on attempt $ATTEMPT"
                break
              fi
            fi
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "⚠️ Build attempt $ATTEMPT failed. Retrying in 10s..."
              sleep 10
            fi
          done
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "::error::Debug APK build failed after $MAX_ATTEMPTS attempts — see build-log.txt above for details"
            exit 1
          fi
          if [ "${RELEASE_SIGNING:-}" = "available" ] && [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "::error::Release APK build failed after $MAX_ATTEMPTS attempts — see build-log.txt above for details"
            exit 1
          fi

      - name: Show build output if failed
        if: failure()
        working-directory: android
        run: |
          echo "=== BUILD LOG (last 150 lines) ==="
          tail -150 build-log.txt 2>/dev/null || true
          echo "=== COMPILATION ERRORS (if any) ==="
          grep -i "error:" build-log.txt 2>/dev/null || true
          echo "=== FAILED TASKS (if any) ==="
          grep -i "FAILED\|BUILD FAILED\|FAILURE:" build-log.txt 2>/dev/null || true
          echo "=== AAPT ERRORS (resource issues) ==="
          grep -i "aapt\|resource\|not found" build-log.txt 2>/dev/null || true

      - name: Select distribution APK + brand the artifact name
        # ─── ARTIFACT NAMING (Brand Clarity A3) ────────────────────────
        # <product>-<version>-<channel>.apk, lowercase. The universal user
        # build carries the company name; per-product variants (vega /
        # atrium / komplete) are built by build-product-apks.yml. The
        # channel suffix makes debug-fallback builds unmistakable.
        run: |
          MAJOR=$(grep '^MAJOR=' android/app/version.properties | cut -d= -f2)
          MINOR=$(grep '^MINOR=' android/app/version.properties | cut -d= -f2)
          PATCH=$(grep '^PATCH=' android/app/version.properties | cut -d= -f2)
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Version: $VERSION"

          if [ "${RELEASE_SIGNING:-}" = "available" ] && [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            DIST_SRC="android/app/build/outputs/apk/release/app-release.apk"
            CHANNEL="release"
          else
            DIST_SRC="android/app/build/outputs/apk/debug/app-debug.apk"
            CHANNEL="debug"
            echo "⚠ Distributing the DEBUG build (release signing unavailable) — filename carries the -debug suffix."
          fi

          APK_BASENAME="practicepro-${VERSION}-${CHANNEL}.apk"
          DIST_APK="android/app/build/outputs/apk/${APK_BASENAME}"
          cp "$DIST_SRC" "$DIST_APK"

          echo "APK_VERSION=$VERSION" >> $GITHUB_ENV
          echo "APK_CHANNEL=$CHANNEL" >> $GITHUB_ENV
          echo "APK_BASENAME=$APK_BASENAME" >> $GITHUB_ENV
          echo "DIST_APK=$DIST_APK" >> $GITHUB_ENV
          echo "Distribution APK ($CHANNEL): $APK_BASENAME"
          ls -la android/app/build/outputs/apk/*/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: practicepro-v${{ env.APK_VERSION }}
          path: |
            ${{ env.DIST_APK }}
            android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish APK as release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: ${{ env.DIST_APK }}
          prerelease: true
          name: PracticePro v${{ env.APK_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version.json with APK release info
        run: |
          APK_URL="https://github.com/R2deetwo/PracticeProVEGA/releases/download/build-${{ github.run_number }}/${{ env.APK_BASENAME }}"
          echo "APK download URL: $APK_URL"
          node -e "
            const fs = require('fs');
            const path = './public/version.json';
            const v = JSON.parse(fs.readFileSync(path, 'utf8'));
            v.apkUrl = process.env.APK_URL;
            v.apkVersion = process.env.APK_VERSION;
            v.apkChannel = process.env.APK_CHANNEL;
            const [maj, min, pat] = process.env.APK_VERSION.split('.').map(Number);
            v.apkVersionCode = maj * 10000 + min * 100 + pat;
            v.apkBuildStatus = 'healthy';
            v.apkBuiltAt = new Date().toISOString();
            fs.writeFileSync(path, JSON.stringify(v, null, 2) + '\n');
            console.log('Updated version.json with APK release info:', JSON.stringify({ apkUrl: v.apkUrl, apkVersion: v.apkVersion, apkChannel: v.apkChannel, apkVersionCode: v.apkVersionCode, apkBuildStatus: v.apkBuildStatus }));
          "
        env:
          APK_URL: https://github.com/R2deetwo/PracticeProVEGA/releases/download/build-${{ github.run_number }}/${{ env.APK_BASENAME }}

      - name: Commit version.json with APK info (race-safe)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/version.json
          git commit -m "chore: update version.json with APK release info [build-${{ github.run_number }}]" || echo "No changes to commit"
          # Race-safe push (same pattern as the bump step)
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main; then
              if git push origin HEAD:main; then
                echo "[version-push] Push succeeded."
                break
              fi
            fi
            echo "[version-push] Attempt $attempt failed. Retrying in 5s..."
            sleep 5
          done

      # Round 11: the "Sync master branch with main" + "Verify Vercel
      # production deploy" steps that used to live here were REMOVED.
      # They force-pushed main→master on every APK build so Vercel's
      # native GitHub integration would auto-deploy PRODUCTION from
      # master — an auto-deploy path that bypassed the deliberate
      # promotion gate (caught live during Round 11 verification: a
      # docs-only push reached production without any promotion).
      # Production now deploys ONLY via production-deploy.yml, and the
      # remote master branch has been deleted to disconnect the native
      # integration's trigger for good.
