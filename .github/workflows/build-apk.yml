name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Permissions needed for:
#   - contents: write → to commit the version bump back to main
#   - actions: write → to manage workflow runs
permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job-level env — exposes the secret presence as a simple boolean string
    # that step-level `if` conditions can safely reference. GitHub Actions
    # cannot reference `secrets.*` directly in step `if` conditions.
    env:
      HAS_CONVEX_KEY: ${{ secrets.CONVEX_DEPLOY_KEY != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        # GitHub Actions runners come with Android SDK pre-installed at
        # /usr/local/lib/android/sdk. We install API 36 build tools + platform
        # because our dependencies (androidx.activity:1.11.0, androidx.core:1.17.0)
        # require compileSdk 36.
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;36.0.0" "platforms;android-36" "platform-tools"
          echo "Android SDK setup complete."
          echo "Installed packages:"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed 2>/dev/null || true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # ─── Auto-Increment PATCH Version ──────────────────────────────────
      # Only increments PATCH (bug fixes, small tweaks). MAJOR and MINOR
      # are manually controlled by the developer.
      #
      # Semantic versioning: MAJOR.MINOR.PATCH (e.g., 1.2.3)
      #   MAJOR — manual, fundamental product changes
      #   MINOR — manual, feature releases
      #   PATCH — auto-incremented here on every CI build
      #
      # Android versionCode is computed by build.gradle as:
      #   MAJOR × 10000 + MINOR × 100 + PATCH
      # so it always strictly increases.
      - name: Increment patch version
        run: |
          cd android/app
          CURRENT=$(grep '^PATCH=' version.properties | cut -d= -f2)
          NEW=$((CURRENT + 1))
          sed -i "s/^PATCH=.*/PATCH=$NEW/" version.properties
          MAJOR=$(grep '^MAJOR=' version.properties | cut -d= -f2)
          MINOR=$(grep '^MINOR=' version.properties | cut -d= -f2)
          echo "Bumped PATCH from $CURRENT to $NEW → version $MAJOR.$MINOR.$NEW"
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/app/version.properties
          git commit -m "chore: bump patch version to $MAJOR.$MINOR.$NEW [skip ci]" || echo "No changes to commit"
          git push

      # ─── Convex Backend Deploy ───────────────────────────────────────────
      # Auto-deploys the Convex backend (schema, mutations, queries, crons)
      # on every push to main. Requires the CONVEX_DEPLOY_KEY GitHub secret.
      # If the secret is not set, HAS_CONVEX_KEY is 'false' and this step
      # is skipped (APK still builds).
      #
      # CRITICAL: `continue-on-error: true` ensures that even if the Convex
      # deploy fails (e.g. parse error in a new file, codegen issue), the
      # APK build still proceeds. The APK doesn't depend on Convex being
      # redeployed — it just needs the web assets bundled. Convex can be
      # fixed and redeployed separately without blocking app updates.
      - name: Deploy Convex backend
        if: ${{ env.HAS_CONVEX_KEY == 'true' }}
        continue-on-error: true
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy --cmd "echo 'Convex deployed successfully'"

      - name: Build web app (bundled into APK)
        run: npx vite build

      - name: Sync Capacitor (bundles dist/ into APK)
        run: npx cap sync android

      - name: Build APK (clean build to purge cached assets)
        working-directory: android
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Verify APK was created and is valid
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          echo "Checking for APK..."
          ls -la android/app/build/outputs/apk/debug/
          if [ ! -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "ERROR: APK was not created!"
            exit 1
          fi
          APK_SIZE=$(du -h android/app/build/outputs/apk/debug/app-debug.apk | cut -f1)
          echo "APK size: $APK_SIZE"
          
          # Verify APK is a valid ZIP/APK file (APKs are ZIP files)
          echo "Verifying APK integrity..."
          if unzip -t android/app/build/outputs/apk/debug/app-debug.apk > /dev/null 2>&1; then
            echo "✓ APK is a valid ZIP/APK file"
          else
            echo "✗ APK is corrupted (failed ZIP integrity check)"
            exit 1
          fi
          
          # Print APK contents (first 20 entries) so we can verify structure
          echo "=== APK contents (first 20 entries) ==="
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | head -25
          
          # Check APK signature
          echo "Checking APK signature..."
          if [ -f android/app/debug.keystore ]; then
            echo "✓ Debug keystore present"
          else
            echo "✗ Debug keystore missing!"
            exit 1
          fi
          
          # Verify the APK is signed
          echo "Verifying APK signature..."
          APKSIGNER=$(find $ANDROID_HOME -name "apksigner" -type f 2>/dev/null | head -1)
          if [ -n "$APKSIGNER" ]; then
            $APKSIGNER verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk 2>&1 | head -10
            echo "✓ APK signature verified"
          else
            echo "WARNING: apksigner not found, skipping signature verification"
          fi
          
          echo "APK is valid and ready."

      - name: Rename APK with version number
        run: |
          # Read version from version.properties
          MAJOR=$(grep '^MAJOR=' android/app/version.properties | cut -d= -f2)
          MINOR=$(grep '^MINOR=' android/app/version.properties | cut -d= -f2)
          PATCH=$(grep '^PATCH=' android/app/version.properties | cut -d= -f2)
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Version: $VERSION"
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "android/app/build/outputs/apk/debug/PracticePro-v${VERSION}.apk"
          # Also keep a generic name for backward compat
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             android/app/build/outputs/apk/debug/PracticePro.apk
          echo "APK_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Final APK files:"
          ls -la android/app/build/outputs/apk/debug/PracticePro*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PracticePro-v${{ env.APK_VERSION }}
          path: |
            android/app/build/outputs/apk/debug/PracticePro-v*.apk
            android/app/build/outputs/apk/debug/PracticePro.apk
          retention-days: 30
          if-no-files-found: error
          compression-level: 0  # APKs are already compressed — don't re-compress
