name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Permissions needed for:
#   - contents: write → to commit the version bump back to main
#   - actions: write → to manage workflow runs
permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job-level env — exposes the secret presence as a simple boolean string
    # that step-level `if` conditions can safely reference. GitHub Actions
    # cannot reference `secrets.*` directly in step `if` conditions.
    env:
      HAS_CONVEX_KEY: ${{ secrets.CONVEX_DEPLOY_KEY != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        # Install API 35 (Android 15 stable) + build-tools 35.0.0
        # using direct sdkmanager (bypasses broken android-actions/setup-android@v3)
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;35.0.0" "platforms;android-35" "platform-tools"
          echo "Android SDK setup complete."

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # ─── Verify keystore fingerprint hasn't changed ────────────────────
      # The debug.keystore must be stable across all builds. If it changes,
      # Android refuses to install the new APK over the old one with
      # "There was a problem while parsing the package" (signature mismatch).
      # This check pins the expected SHA-256 fingerprint and fails loudly
      # if it ever drifts, so this silent failure mode can't recur.
      - name: Verify debug keystore fingerprint
        run: |
          EXPECTED_SHA256="C3:16:40:FD:48:30:E1:30:D8:30:FD:BD:7E:38:96:93:DC:B4:B4:EE:76:15:60:3C:3F:D3:AE:B8:EC:5A:13:C8"
          ACTUAL_SHA256=$(keytool -list -v -keystore android/app/debug.keystore -storepass android 2>/dev/null | grep "SHA256:" | awk '{print $2}')
          echo "Expected: $EXPECTED_SHA256"
          echo "Actual:   $ACTUAL_SHA256"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: debug.keystore fingerprint has changed!"
            echo "This will cause 'There was a problem while parsing the package' on all existing installs."
            echo "If this is intentional (e.g. migrating to a release keystore), update EXPECTED_SHA256 in the workflow."
            exit 1
          fi
          echo "✓ Keystore fingerprint matches — existing installs will update cleanly"

      # ─── Patch biometric plugin to use stable AGP ─────────────────────
      # The @aparajita/capacitor-biometric-auth plugin bundles its own
      # build.gradle with AGP 8.13.2 (requires API 36, produces broken APKs).
      # We patch it to use AGP 8.9.1 (stable, works with API 35).
      # This runs AFTER npm install so node_modules exists.
      - name: Patch biometric plugin AGP version
        run: |
          PLUGIN_GRADLE="node_modules/@aparajita/capacitor-biometric-auth/android/build.gradle"
          if [ -f "$PLUGIN_GRADLE" ]; then
            echo "Patching $PLUGIN_GRADLE..."
            sed -i 's/classpath .com.android.tools.build:gradle:8.13.2./classpath "com.android.tools.build:gradle:8.9.1"/g' "$PLUGIN_GRADLE"
            sed -i "s/compileSdkVersion = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36/compileSdkVersion = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35/g" "$PLUGIN_GRADLE"
            sed -i "s/targetSdkVersion = project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36/targetSdkVersion = project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 35/g" "$PLUGIN_GRADLE"
            sed -i "s/'1.13.0'/'1.12.0'/g" "$PLUGIN_GRADLE"
            echo "Patched. Verifying:"
            grep -n "classpath\|compileSdkVersion\|targetSdkVersion\|materialVersion" "$PLUGIN_GRADLE" | head -10
          else
            echo "WARNING: Plugin build.gradle not found at $PLUGIN_GRADLE"
          fi

      # ─── Auto-Increment PATCH Version ──────────────────────────────────
      # Only increments PATCH (bug fixes, small tweaks). MAJOR and MINOR
      # are manually controlled by the developer.
      #
      # Semantic versioning: MAJOR.MINOR.PATCH (e.g., 1.2.3)
      #   MAJOR — manual, fundamental product changes
      #   MINOR — manual, feature releases
      #   PATCH — auto-incremented here on every CI build
      #
      # Android versionCode is computed by build.gradle as:
      #   MAJOR × 10000 + MINOR × 100 + PATCH
      # so it always strictly increases.
      - name: Increment patch version
        run: |
          cd android/app
          CURRENT=$(grep '^PATCH=' version.properties | cut -d= -f2)
          NEW=$((CURRENT + 1))
          sed -i "s/^PATCH=.*/PATCH=$NEW/" version.properties
          MAJOR=$(grep '^MAJOR=' version.properties | cut -d= -f2)
          MINOR=$(grep '^MINOR=' version.properties | cut -d= -f2)
          echo "Bumped PATCH from $CURRENT to $NEW → version $MAJOR.$MINOR.$NEW"
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/app/version.properties
          git commit -m "chore: bump patch version to $MAJOR.$MINOR.$NEW [skip ci]" || echo "No changes to commit"
          git push

      # ─── Convex Backend Deploy ───────────────────────────────────────────
      # Auto-deploys the Convex backend (schema, mutations, queries, crons)
      # on every push to main. Requires the CONVEX_DEPLOY_KEY GitHub secret.
      # If the secret is not set, HAS_CONVEX_KEY is 'false' and this step
      # is skipped (APK still builds).
      #
      # CRITICAL: `continue-on-error: true` ensures that even if the Convex
      # deploy fails (e.g. parse error in a new file, codegen issue), the
      # APK build still proceeds. The APK doesn't depend on Convex being
      # redeployed — it just needs the web assets bundled. Convex can be
      # fixed and redeployed separately without blocking app updates.
      - name: Deploy Convex backend
        if: ${{ env.HAS_CONVEX_KEY == 'true' }}
        continue-on-error: true
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy --cmd "echo 'Convex deployed successfully'"

      - name: Build web app (bundled into APK)
        run: npx vite build

      - name: Sync Capacitor (bundles dist/ into APK)
        run: |
          npx cap sync android
          # Verify cap sync actually worked
          if [ ! -f android/app/src/main/assets/capacitor.config.json ]; then
            echo "ERROR: cap sync failed — capacitor.config.json not found in assets!"
            exit 1
          fi
          if [ ! -f android/app/src/main/assets/capacitor.plugins.json ]; then
            echo "ERROR: cap sync failed — capacitor.plugins.json not found in assets!"
            exit 1
          fi
          if [ ! -d android/app/src/main/assets/public ]; then
            echo "ERROR: cap sync failed — web assets not copied to assets/public!"
            exit 1
          fi
          echo "✓ Capacitor sync verified:"
          echo "  - capacitor.config.json: present"
          echo "  - capacitor.plugins.json: present"
          echo "  - web assets: $(ls android/app/src/main/assets/public/ | wc -l) files"
          # Check for capacitor.build.gradle (generated by cap sync)
          if [ -f android/app/capacitor.build.gradle ]; then
            echo "  - capacitor.build.gradle: present"
          else
            echo "  - capacitor.build.gradle: not found (may be normal)"
          fi

      - name: Build APK (clean build to purge cached assets)
        working-directory: android
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build-log.txt

      - name: Show build output if failed
        if: failure()
        run: tail -200 build-log.txt

      # ─── FULL APK DIAGNOSTIC ──────────────────────────────────────────
      # Dump EVERYTHING about the APK so we can see exactly what's wrong.
      - name: Full APK diagnostic
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          echo "=========================================="
          echo "APK FILE: $APK"
          echo "SIZE: $(du -h "$APK" | cut -f1)"
          echo "=========================================="
          
          echo ""
          echo "=== 1. ZIP INTEGRITY ==="
          unzip -t "$APK" 2>&1 | tail -5
          
          echo ""
          echo "=== 2. FULL APK CONTENTS ==="
          unzip -l "$APK"
          
          echo ""
          echo "=== 3. REQUIRED FILES CHECK ==="
          for f in classes.dex resources.arsc AndroidManifest.xml; do
            if unzip -l "$APK" | grep -q "$f"; then
              echo "✓ $f: FOUND"
            else
              echo "✗ $f: MISSING!"
            fi
          done
          
          echo ""
          echo "=== 4. AAPT BADGING (package info) ==="
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" 2>&1
          
          echo ""
          echo "=== 5. APKSIGNER VERIFY ==="
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK" 2>&1
          
          echo ""
          echo "=== 6. ZIPALIGN CHECK ==="
          $ANDROID_HOME/build-tools/35.0.0/zipalign -c -v 4 "$APK" 2>&1 | tail -10
          
          echo ""
          echo "=== 7. SHA256 CHECKSUM ==="
          sha256sum "$APK" | tee pre-upload.sha256
          
          echo ""
          echo "=========================================="
          echo "DIAGNOSTIC COMPLETE"
          echo "=========================================="

      - name: Rename APK with version number
        run: |
          MAJOR=$(grep '^MAJOR=' android/app/version.properties | cut -d= -f2)
          MINOR=$(grep '^MINOR=' android/app/version.properties | cut -d= -f2)
          PATCH=$(grep '^PATCH=' android/app/version.properties | cut -d= -f2)
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Version: $VERSION"
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "android/app/build/outputs/apk/debug/PracticePro-v${VERSION}.apk"
          echo "APK_VERSION=$VERSION" >> $GITHUB_ENV
          echo "APK_FILENAME=PracticePro-v${VERSION}.apk" >> $GITHUB_ENV
          echo "Final APK:"
          ls -la android/app/build/outputs/apk/debug/PracticePro-v*.apk

      # ─── Upload via actions/upload-artifact ─────
      - name: Upload APK via artifact
        uses: actions/upload-artifact@v4
        with:
          name: PracticePro-v${{ env.APK_VERSION }}
          path: android/app/build/outputs/apk/debug/PracticePro-v*.apk
          retention-days: 30
          if-no-files-found: error

      # ─── STEP 2: Round-trip corruption test ───────────────────────────
      - name: Round-trip download in same job
        uses: actions/download-artifact@v4
        with:
          name: PracticePro-v${{ env.APK_VERSION }}
          path: roundtrip-check/

      - name: Compare checksums pre vs post artifact transport
        run: |
          echo "--- SHA256 after round-trip ---"
          sha256sum roundtrip-check/*.apk
          echo "--- Original ---"
          cat pre-upload.sha256
          diff <(sha256sum roundtrip-check/*.apk | awk '{print $1}') <(awk '{print $1}' pre-upload.sha256) && echo "MATCH - no corruption in transport" || echo "MISMATCH - artifact pipeline corrupts binary"

      # ─── STEP 3: Publish as GitHub Release asset ─────────────────────
      # Release assets are stored raw (not re-zipped), bypassing the
      # artifact pipeline corruption entirely. Download via:
      #   gh release download build-<run_number> --pattern "*.apk"
      #   or: https://github.com/R2deetwo/PracticeProVEGA/releases
      - name: Publish APK as release asset (bypasses artifact repackaging)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/PracticePro-v*.apk
          prerelease: true
          name: PracticePro v${{ env.APK_VERSION }}
          body: |
            APK build ${{ github.run_number }} (v${{ env.APK_VERSION }})

            **Download the .apk file below.** Release assets are stored raw
            and are NOT re-zipped by GitHub's artifact pipeline.

            If the artifact download gives "parsing the package" error,
            use this release asset instead — it is byte-for-byte identical
            to what was built on the CI runner.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
