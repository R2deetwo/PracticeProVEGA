name: Deploy to Cloudflare Workers

# Deploys the built web app to Cloudflare Workers (static assets hosting).
# This is a SEPARATE deployment target from Vercel — it serves the same
# app at https://practice-pro-vega.prototypechigo.workers.dev
#
# This workflow bypasses Vercel's 100-deploy/day free plan limit.
#
# Requires these GitHub secrets:
#   CLOUDFLARE_API_TOKEN  — Cloudflare API token with Workers permissions
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check required secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "⚠️  CLOUDFLARE_API_TOKEN not set — skipping Cloudflare deploy"
            echo "can_deploy=false" >> $GITHUB_OUTPUT
          else
            echo "✓ CLOUDFLARE_API_TOKEN is set"
            echo "can_deploy=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        if: steps.check.outputs.can_deploy == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.check.outputs.can_deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.check.outputs.can_deploy == 'true'
        run: npm ci

      - name: Build web app
        if: steps.check.outputs.can_deploy == 'true'
        run: npm run build

      - name: Deploy to Cloudflare Workers
        if: steps.check.outputs.can_deploy == 'true'
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify deployment
        if: steps.check.outputs.can_deploy == 'true'
        run: |
          echo "Waiting 15s for Cloudflare to propagate..."
          sleep 15

          WORKERS_URL="https://practice-pro-vega.prototypechigo.workers.dev"
          RESPONSE=$(curl -s "$WORKERS_URL/version.json?_=$(date +%s)" 2>/dev/null || echo "{}")
          SHA=$(echo "$RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin).get('sha','unknown')[:8])" 2>/dev/null || echo "error")
          STATUS=$(echo "$RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin).get('status','unknown'))" 2>/dev/null || echo "error")
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_SHA_SHORT="${COMMIT_SHA:0:8}"

          echo "Cloudflare Workers deploy:"
          echo "  Expected SHA: $COMMIT_SHA_SHORT"
          echo "  Actual SHA:   $SHA"
          echo "  Status:       $STATUS"

          if [ "$SHA" = "$COMMIT_SHA_SHORT" ]; then
            echo "✅ Cloudflare Workers is serving the latest commit"
          else
            echo "⚠️  Cloudflare SHA doesn't match yet (may still be propagating)"
          fi
