name: Health Watchdog

# R17 (SaaS hardening plan) — observability + alerting.
#
# WHAT: a zero-dependency uptime watchdog for the surfaces users actually
# hit, running every 15 minutes on GitHub's scheduled runners:
#   1. Production frontend  — https://practice-pro-vega.vercel.app (root + version.json healthy)
#   2. Production backend   — Convex gregarious-malamute-537 (query round-trip)
#   3. Cloudflare mirror    — checked but report-only (known frozen: expired token, see RUNBOOK)
#
# ALERTING: on any FAILURE the job fails (GitHub emails the repo owner
# immediately — the zero-config channel) AND a deduplicated issue titled
# "[WATCHDOG] ..." is opened so the incident has a thread. When the probe
# recovers, the issue auto-closes with a comment.
#
# SIMULATED-FAILURE DRILL (the plan's R17 acceptance: "alert fires on a
# simulated failure"): run this workflow manually with simulate=true —
# it probes an intentionally-bogus URL, proves the alert issue gets
# created, then closes it with a "DRILL" comment. Leave no noise behind.
#
# WHY NOT AN EXTERNAL UPTIME SERVICE: no accounts, no cost, no secrets to
# leak — and the alert channel (email on failed run + issue) already
# exists. When the product grows, swap this for a dedicated monitor and
# keep this workflow as the backup.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      simulate:
        description: "Simulate a failure to prove the alert path (opens + closes a drill issue)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: health-watchdog
  cancel-in-progress: false

env:
  PROD_URL: https://practice-pro-vega.vercel.app
  CONVEX_URL: https://gregarious-malamute-537.convex.cloud
  CF_MIRROR_URL: https://practice-pro-vega.prototypechigo.workers.dev
  WATCHDOG_LABEL: watchdog

jobs:
  watchdog:
    name: Probe production surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decide probe targets (simulate mode swaps in a bogus URL)
        id: config
        run: |
          if [ "${{ github.event.inputs.simulate }}" = "true" ]; then
            echo "Frontend target: BOGUS (simulated failure)"
            echo "PROD_TARGET=https://watchdog-drill-bogus.invalid" >> "$GITHUB_ENV"
            echo "DRILL=true" >> "$GITHUB_ENV"
          else
            echo "PROD_TARGET=${PROD_URL}" >> "$GITHUB_ENV"
            echo "DRILL=false" >> "$GITHUB_ENV"
          fi

      - name: Probe production frontend (root + version.json)
        id: frontend
        # In drill mode the probe fails BY DESIGN — keep the job green so the
        # drill's own verdict (issue created + closed cleanly) is the signal.
        continue-on-error: ${{ github.event.inputs.simulate == 'true' }}
        run: |
          set +e
          ROOT_CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "$PROD_TARGET" 2>/dev/null)
          VERSION_JSON=$(curl -sS --max-time 20 "$PROD_TARGET/version.json" 2>/dev/null)
          VERSION_STATUS=$(echo "$VERSION_JSON" | jq -r '.status // "missing"' 2>/dev/null)
          VERSION_SHA=$(echo "$VERSION_JSON" | jq -r '.sha // "missing"' 2>/dev/null)
          set -e
          echo "root_http_code=$ROOT_CODE" >> "$GITHUB_OUTPUT"
          echo "version_status=$VERSION_STATUS" >> "$GITHUB_OUTPUT"
          echo "version_sha=$VERSION_SHA" >> "$GITHUB_OUTPUT"
          echo "Frontend: HTTP $ROOT_CODE, version.json status=$VERSION_STATUS sha=$VERSION_SHA"
          if [ "$ROOT_CODE" != "200" ] || [ "$VERSION_STATUS" != "healthy" ]; then
            echo "frontend_ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "frontend_ok=true" >> "$GITHUB_OUTPUT"

      - name: Probe production Convex backend (query round-trip)
        id: backend
        if: env.DRILL != 'true'
        run: |
          set +e
          RESP=$(curl -sS --max-time 20 -X POST "$CONVEX_URL/api/query" \
            -H 'Content-Type: application/json' \
            -d '{"path":"myFunctions:getUser","args":{"tokenIdentifier":"watchdog-probe@invalid.example"}}' 2>/dev/null)
          CODE=$?
          set -e
          echo "convex_exit=$CODE response=$(echo "$RESP" | head -c 120)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ $CODE -ne 0 ] || ! echo "$RESP" | jq -e . >/dev/null 2>&1; then
            echo "backend_ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "backend_ok=true" >> "$GITHUB_OUTPUT"

      - name: Probe Cloudflare mirror (report-only — known frozen, see RUNBOOK)
        if: env.DRILL != 'true'
        run: |
          CF_CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 "$CF_MIRROR_URL/version.json" 2>/dev/null || echo "000")
          CF_SHA=$(curl -sS --max-time 15 "$CF_MIRROR_URL/version.json" 2>/dev/null | jq -r '.sha // "missing"' 2>/dev/null)
          PROD_SHA="${{ steps.frontend.outputs.version_sha }}"
          echo "Cloudflare mirror: HTTP $CF_CODE, sha=$CF_SHA (prod is $PROD_SHA)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$CF_SHA" != "$PROD_SHA" ]; then
            echo "::warning::Cloudflare mirror is stale ($CF_SHA vs prod $PROD_SHA). Known open item: CLOUDFLARE_API_TOKEN expired — see RUNBOOK.md 'Cloudflare mirror'."
          fi

      - name: Open (or update) the alert issue on failure
        if: failure() || env.DRILL == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="[WATCHDOG] Production health check failed — $(date -u +%Y-%m-%d\ %H:%M\ UTC)"
          if [ "${{ env.DRILL }}" = "true" ]; then
            TITLE="[WATCHDOG][DRILL] Simulated failure — alert path test"
          fi
          BODY=$(cat <<'EOF'
          The health watchdog detected a problem.

          | Surface | Result |
          |---|---|
          | Frontend root | ${{ steps.frontend.outputs.root_http_code }} (expect 200) |
          | version.json | ${{ steps.frontend.outputs.version_status }} (expect healthy) |
          | Convex backend | ${{ steps.backend.outputs.backend_ok || 'skipped (drill)' }} |

          **Next steps:** follow RUNBOOK.md → "Incident: site down".
          This issue closes automatically when the watchdog recovers.
          EOF
          )
          # Ensure the label exists (idempotent; 422 = already exists is fine).
          curl -s -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/labels" \
            -d '{"name":"watchdog","color":"d93f0b","description":"Automated health watchdog alerts"}' | grep -q '"id"' || true
          # Deduplicate: reuse the open watchdog issue if one exists (REST, no gh quirks).
          EXISTING=$(curl -s -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues?labels=watchdog&state=open" | jq -r '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            curl -s -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/issues/$EXISTING/comments" \
              -d "{\"body\":\"Still failing: $TITLE\"}" > /dev/null
          else
            ISSUE_CODE=$(curl -s -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" -w "%{http_code}" -o /dev/null \
              "https://api.github.com/repos/${{ github.repository }}/issues" \
              -d "$(jq -n --arg t "$TITLE" --arg b "$BODY" '{title:$t, body:$b, labels:["watchdog"]}')")
            if [ "$ISSUE_CODE" = "201" ] || [ "$ISSUE_CODE" = "200" ]; then
              echo "alert issue created (HTTP $ISSUE_CODE)"
            else
              echo "::error::Alert issue creation failed (HTTP $ISSUE_CODE) — the alert path itself is broken!"
              exit 1
            fi
          fi
          echo "Alert issue handled: $TITLE"

      - name: Auto-close the alert issue on recovery
        if: success() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(curl -s -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues?labels=watchdog&state=open" | jq -r '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            curl -s -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/issues/$EXISTING/comments" \
              -d '{"body":"✅ Recovered at '"$(date -u +%Y-%m-%dT%H:%M:%SZ)"' — all probes green. Auto-closing."}' > /dev/null
            curl -s -X PATCH -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/issues/$EXISTING" \
              -d '{"state":"closed"}' > /dev/null
          fi

      - name: Drill cleanup (close the simulated-failure issue)
        if: always() && env.DRILL == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 2
          EXISTING=$(curl -s -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues?labels=watchdog&state=open" | jq -r '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            curl -s -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/issues/$EXISTING/comments" \
              -d '{"body":"🧪 DRILL complete — the simulated failure produced this alert exactly as designed. Closing."}' > /dev/null
            curl -s -X PATCH -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/issues/$EXISTING" \
              -d '{"state":"closed"}' > /dev/null
            echo "DRILL PASS: alert issue was created and closed cleanly." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "DRILL_PASS=true" >> "$GITHUB_ENV"
          else
            echo "::error::DRILL FAIL: no alert issue was created by the simulated failure."
            exit 1
          fi
