name: Build Admin APK

on:
  push:
    branches: [main]
    paths:
      - 'src/admin/**'
      - 'admin.html'
      - 'vite.admin.config.ts'
      - 'capacitor.admin.config.ts'
      - '.github/workflows/build-admin-apk.yml'
      - 'android/app/build.gradle'
      - 'android/app/proguard-rules.pro'
      - 'android/app/src/main/java/**'
  workflow_dispatch:

# Cancel superseded runs — prevents race conditions when multiple admin
# commits are pushed in quick succession.
concurrency:
  group: admin-apk-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-admin-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          # FIX: Install SDK 36 (was SDK 35) — variables.gradle requires
          # compileSdkVersion = 36 and targetSdkVersion = 36. The previous
          # SDK 35 setup caused the admin APK build to fail with:
          #   "Failed to find Build Tools revision 36.0.0"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;36.0.0" "platforms;android-36" "platform-tools"
          echo "Android SDK 36 setup complete."

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate debug.keystore if missing
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            echo "debug.keystore not found — generating with standard Android debug credentials..."
            keytool -genkeypair \
              -keystore android/app/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -storetype PKCS12
            echo "✓ debug.keystore generated"
          else
            echo "✓ debug.keystore already exists"
          fi

      - name: Generate release.keystore if missing
        run: |
          if [ ! -f android/app/release.keystore ]; then
            if [ -n "${{ secrets.RELEASE_STORE_PASSWORD }}" ]; then
              echo "release.keystore not found — generating..."
              keytool -genkeypair \
                -keystore android/app/release.keystore \
                -alias practicepro-app \
                -keyalg RSA -keysize 4096 \
                -validity 10950 \
                -storepass "${{ secrets.RELEASE_STORE_PASSWORD }}" \
                -keypass "${{ secrets.RELEASE_KEY_PASSWORD }}" \
                -dname "CN=PracticePro Systems Limited, OU=Engineering, O=PracticePro Systems Limited, L=Lagos, ST=Lagos, C=NG" \
                -storetype PKCS12
              keytool -genkeypair \
                -keystore android/app/release.keystore \
                -alias practicepro-admin \
                -keyalg RSA -keysize 4096 \
                -validity 10950 \
                -storepass "${{ secrets.RELEASE_STORE_PASSWORD }}" \
                -keypass "${{ secrets.RELEASE_KEY_PASSWORD }}" \
                -dname "CN=PracticePro Systems Limited, OU=Founder App, O=PracticePro Systems Limited, L=Lagos, ST=Lagos, C=NG" \
                -storetype PKCS12
              echo "✓ release.keystore generated with both aliases"
            else
              echo "⚠ RELEASE_STORE_PASSWORD secret not set — release builds will fall back to debug signing"
            fi
          else
            echo "✓ release.keystore already exists"
          fi

      - name: Build admin frontend
        run: npm run build:admin
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}

      - name: Sync to Android
        run: node scripts/sync-admin-config.cjs

      - name: Build Debug APK (with retry)
        working-directory: android
        run: |
          ATTEMPT=0
          MAX_ATTEMPTS=3
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "=== Admin APK Build attempt $ATTEMPT/$MAX_ATTEMPTS ==="
            ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build-log.txt
            if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
              echo "✓ Admin APK built successfully on attempt $ATTEMPT"
              break
            fi
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "⚠️ Build attempt $ATTEMPT failed. Retrying in 10s..."
              sleep 10
            fi
          done
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "::error::Admin APK build failed after $MAX_ATTEMPTS attempts"
            tail -150 build-log.txt 2>/dev/null || true
            exit 1
          fi

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: practicepro-admin-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build Release APK
        if: github.ref == 'refs/heads/main'
        working-directory: android
        env:
          RELEASE_STORE_FILE: android/app/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: practicepro-admin
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: practicepro-admin-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: admin-build-${{ github.run_number }}
          name: PracticePro Admin APK (Build ${{ github.run_number }})
          files: |
            android/app/build/outputs/apk/release/app-release.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
