name: Build Admin APK

on:
  push:
    branches: [main]
    paths:
      - 'src/admin/**'
      - 'admin.html'
      - 'vite.admin.config.ts'
      - 'capacitor.admin.config.ts'
      - '.github/workflows/build-admin-apk.yml'
      - 'android/app/build.gradle'
      - 'android/app/proguard-rules.pro'
      - 'android/app/src/main/java/**'
      # Firebase config changes MUST rebuild the founder APK — the
      # google-services Gradle plugin reads this file at build time.
      - 'android/app/google-services.json'
      # Native notification assets (2026-09-14 round 2): the small icon
      # (res/drawable/ic_notification.xml), channel sound
      # (res/raw/notification.wav), colors, and the FCM default-icon
      # meta-data in the manifest are all baked into the APK — without
      # these paths the founder build would keep shipping the broken
      # white-circle 'i' badge icon.
      - 'android/app/src/main/AndroidManifest.xml'
      - 'android/app/src/main/res/**'
      # The push-registration hook is bundled into the APK — changes to it
      # (e.g. the sessionToken race fix) need a rebuild to reach devices.
      - 'src/hooks/usePushNotifications.ts'
      # The notification manager (channels, foreground dedup, smart grouping)
      # is shared code bundled into BOTH APKs — founder devices need a rebuild
      # when it changes (2026-09-14 categorization round).
      - 'src/utils/notifications.ts'
  workflow_dispatch:

# Cancel superseded runs — prevents race conditions when multiple admin
# commits are pushed in quick succession.
concurrency:
  group: admin-apk-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-admin-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          # FIX: Install SDK 36 (was SDK 35) — variables.gradle requires
          # compileSdkVersion = 36 and targetSdkVersion = 36. The previous
          # SDK 35 setup caused the admin APK build to fail with:
          #   "Failed to find Build Tools revision 36.0.0"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;36.0.0" "platforms;android-36" "platform-tools"
          echo "Android SDK 36 setup complete."

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate debug.keystore if missing
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            echo "debug.keystore not found — generating with standard Android debug credentials..."
            keytool -genkeypair \
              -keystore android/app/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -storetype PKCS12
            echo "✓ debug.keystore generated"
          else
            echo "✓ debug.keystore already exists"
          fi

      - name: Decode release keystore from secret
        # Brand Clarity A5 (same fix as build-apk.yml): the old step
        # generated a NEW random keystore per ephemeral CI run — unstable
        # signatures. The keystore now comes from RELEASE_KEYSTORE_BASE64.
        # It carries BOTH aliases (practicepro-app + practicepro-admin) —
        # one-time creation in docs/brand/BRAND_CLARITY_RUNBOOK.md.
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            if [ -s android/app/release.keystore ]; then
              echo "✓ release.keystore decoded from secret (alias: practicepro-admin)"
            else
              echo "⚠ decoded keystore is empty — release build will fall back to debug signing"
            fi
          else
            echo "⚠ RELEASE_KEYSTORE_BASE64 not set — release build will fall back to debug signing."
            echo "⚠ Setup: docs/brand/BRAND_CLARITY_RUNBOOK.md"
          fi

      - name: Build admin frontend
        run: npm run build:admin
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL || 'https://gregarious-malamute-537.convex.cloud' }}

      - name: Sync to Android
        run: node scripts/sync-admin-config.cjs

      - name: Build Debug APK (with retry)
        working-directory: android
        run: |
          ATTEMPT=0
          MAX_ATTEMPTS=3
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "=== Admin APK Build attempt $ATTEMPT/$MAX_ATTEMPTS ==="
            ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build-log.txt
            if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
              echo "✓ Admin APK built successfully on attempt $ATTEMPT"
              break
            fi
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "⚠️ Build attempt $ATTEMPT failed. Retrying in 10s..."
              sleep 10
            fi
          done
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "::error::Admin APK build failed after $MAX_ATTEMPTS attempts"
            tail -150 build-log.txt 2>/dev/null || true
            exit 1
          fi

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: practicepro-admin-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build Release APK
        if: github.ref == 'refs/heads/main'
        working-directory: android
        env:
          RELEASE_STORE_FILE: android/app/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: practicepro-admin
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK (brand-named artifact)
        # Brand Clarity A3: the founder APK keeps the company name — it is a
        # company tool. Named practicepro-founder-<version>-<channel>.apk.
        if: github.ref == 'refs/heads/main'
        run: |
          VERSION="$(grep '^MAJOR=' android/app/version.properties | cut -d= -f2).$(grep '^MINOR=' android/app/version.properties | cut -d= -f2).$(grep '^PATCH=' android/app/version.properties | cut -d= -f2)"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            mkdir -p dist-founder
            cp android/app/build/outputs/apk/release/app-release.apk "dist-founder/practicepro-founder-$VERSION-release.apk"
            echo "✓ dist-founder/practicepro-founder-$VERSION-release.apk"
          fi
      - name: Upload Release APK artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: practicepro-founder-release
          path: dist-founder/practicepro-founder-*.apk
          retention-days: 90
          if-no-files-found: ignore

      # Brand Clarity guardrail #8: the founder APK is NEVER published as a
      # public GitHub Release on this public repository — the old
      # softprops/action-gh-release step (tag admin-build-<run>) made the
      # founder build downloadable by anyone. Login-gated Actions artifacts
      # (above) are the only distribution channel for the founder APK.
