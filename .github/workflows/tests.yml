name: Tests

# Round 10 (SaaS hardening plan) — the quality gate.
#
# BEFORE this workflow existed, CI built and deployed but never tested:
# the deploy-freeze (Round 6) and the firm-settings save failure (Round 9)
# were both found by hand-probing production because nothing else could
# catch them. This suite locks in the regression classes from Rounds 6-9:
#   - tests/unit/callerAuth.test.ts            (Round 8 auth retrofit)
#   - tests/unit/resolveRecordForUpdate.test.ts (Round 9 firm-settings bug)
#   - tests/unit/unitLookup.test.ts             (Round 6 shared unit resolver)
#
# The gates, in order:
#   1. npx tsc -p convex --noEmit  → MUST be 0 errors (the real Convex
#      deploy gate — a TS error here froze backend deploys for weeks in
#      Round 6 while CI stayed green).
#   2. root tsc --noEmit           → MUST be 0 errors (the 94-error
#      debt baseline was cleared 2026-11-18; new errors fail CI).
#   3. npx vitest run              → the in-repo test suite.
#
# Every deploy workflow (Staging, Production, APK) runs this same gate
# inline as a required job — a red suite blocks every deploy.

on:
  push:
    branches-ignore: []
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck Convex backend (deploy gate — must be 0 errors)
        run: |
          echo "Running: npx tsc -p convex --noEmit"
          if npx tsc -p convex --noEmit; then
            echo "✅ Convex typecheck clean (0 errors)"
          else
            echo "::error::convex/ typecheck FAILED. npx convex deploy will reject this code — fix before pushing. (This exact class froze backend deploys while CI stayed green: see worklog Round 6.)"
            exit 1
          fi

      - name: Typecheck app (must be 0 errors)
        run: |
          set +e
          npx tsc --noEmit 2>&1 | tee /tmp/root-tsc.log | tail -5
          ERRORS=$(grep -c "error TS" /tmp/root-tsc.log)
          set -e
          echo "Root tsc errors: $ERRORS (required: 0)"
          if [ "$ERRORS" -ne 0 ]; then
            echo "::error::Root tsc reported $ERRORS error(s). The baseline exception was removed on 2026-11-18 (debt burned 87 to 0) - fix all errors before deploy."
            exit 1
          fi
          echo "Root tsc clean (0 errors)"
      - name: Identity audit (R16 — no public function may trust caller-supplied identity)
        run: |
          echo "Running: python3 scripts/audit-identity.py"
          python3 scripts/audit-identity.py

      - name: Design-token gate (P4 — gray-* growth banned; docs/design/TOKENS.md)
        run: node scripts/check-design-tokens.mjs

      - name: UI-primitives ratchet gate (ADR-0004 — raw form elements may not grow)
        run: node scripts/check-ui-primitives.mjs

      - name: Run unit test suite
        run: npx vitest run
