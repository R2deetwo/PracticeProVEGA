<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- PracticePro Atrium — the Coin, in the round (R26, owner direction:
       "just do new logos, choose yourself"). Twin of the Vega coin: one
       solid emerald disc (the estate) with the square open court cut
       through its heart — the atrium IS its court. A square void in a
       round coin: the shape of a classical coin of trade, for the
       product that collects the rent. Emerald on the estate's cream,
       the register of the live /atrium page. -->
  <defs>
    <linearGradient id="at" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C7A57"/>
      <stop offset="1" stop-color="#053D2C"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="46" height="46" rx="11.5" fill="#FAF7F2"/>
  <rect x="1" y="1" width="46" height="46" rx="11.5" fill="none" stroke="#0C7A57" stroke-opacity="0.4" stroke-width="1.5"/>
