<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- PracticePro Atrium — THE STEPPED STACK (R57).
       Owner direction: "the atrium favicon and logo, they are too chunky.
       i think we ought to use a different color as well please. it
       should look like the style of the practicepro logo but it should
       be a different color that works well." So this is the company
       logo's own construction (public/logo.svg), translated: a FLAT
       indigo tile — #4F46E5, distinct from the hub's green #16A34A,
       Vega's burnt orange and Komplete's deep ink, and the classic
       cool counterpoint to Atrium's cream, sage and emerald page —
       three stepped translucent white blocks (100% / 80% / 60%, each
       wider than the one above: the document stack), and the letter
       cut in NEGATIVE space from the top block in the tile's own
       color, exactly how the company P is cut from its white block.
       The chunky solid emerald tile with the fat white A (R47/R51)
       retires. The letterform keeps R51's box register (flat top,
       orthogonal edges) at the company P's stroke ratio (stems = 25%
       of the letter width). Identical geometry to the in-app
       AtriumMark. -->
  <defs>
    <clipPath id="atclip">
      <rect width="48" height="48" rx="10.5"/>
    </clipPath>
  </defs>
  <!-- The estate tile — flat indigo, one color like the company logo's
       flat green. No gradient, no hairline: the stepped white stack
       holds the tile's edge on light and dark browser chrome alike. -->
  <rect width="48" height="48" rx="10.5" fill="#4F46E5"/>
  <g clip-path="url(#atclip)">
    <!-- THE STEPPED STACK — three flush white blocks, each wider than
         the one above (27 → 30 → 33 of 48), opacities stepping
         100% → 80% → 60%: the company logo's document stack, at the
         P logo's own proportions (64-unit geometry × 0.75). -->
    <rect x="10.5" y="6" width="27" height="21" rx="1.5" fill="#FFFFFF"/>
    <rect x="9" y="27" width="30" height="7.5" rx="1.5" fill="#FFFFFF" fill-opacity="0.8"/>
    <rect x="7.5" y="34.5" width="33" height="7.5" rx="1.5" fill="#FFFFFF" fill-opacity="0.6"/>
    <!-- THE A — cut through the top block in the tile's own indigo
         (negative space, the P's own formula): an 18×18 letter box
         with the block's own margins, 4.5-unit stems (the P's stroke
         ratio), a 9×6 counter and a 6-unit open foot. Every edge
         orthogonal (R51). Legible at 16px: stems 1.5px, counter 3×2px. -->
    <path
      fill-rule="evenodd"
      d="M15 7.5 H33 V25.5 H28.5 V19.5 H19.5 V25.5 H15 Z
         M19.5 10.5 H28.5 V16.5 H19.5 Z"
      fill="#4F46E5"/>
  </g>
</svg>
