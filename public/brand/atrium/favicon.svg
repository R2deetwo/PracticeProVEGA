<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- PracticePro Atrium — THE BIG A (R47, redrawn R51).
       Owner direction: "I don't like the favicon or even the icon for
       Atrium. For Atrium, I think it would look better if you look at
       the Practice Pro favicon. It looks much clearer. You can see what
       it is. There's a big P." The R39/R41 courtyard coin is
       retired — abstract geometry never read as fast as a letter. This
       is the company favicon's own formula, in Atrium's register: a
       full-bleed emerald tile (the bright emerald the owner approved
       for the tab in R41 — #10B981 lit toward #059669, so it reads
       clearly GREEN on light and dark browser chrome) with a bold white
       A. The company tile says P; the estate tile says A. R51 redraws
       the letter by owner direction ("make the 'A' have a flat top it
       looks too pointed please. it should be a box 'A' not with
       slants"): flat top, vertical stems, rectangular counter and
       squared notch — every edge orthogonal. -->
  <defs>
    <linearGradient id="at" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="10.5" fill="url(#at)"/>
  <!-- THE A — one bold BOX letterform (R51), solid white, sized like the
       company favicon's big P: the letter spans 75% of the tile's width
       and 81% of its height; flat top, vertical 8.5-unit stems (the P's
       own stem weight at tab scale); 6.5-unit crossbar; rectangular
       counter and squared foot notch — every edge orthogonal. Counter
       and notch stay legible at 16px. Identical geometry to the in-app
       AtriumMark. -->
  <path
    fill-rule="evenodd"
    d="M6 4.5 H42 V43.5 H33.5 V32 H14.5 V43.5 H6 Z
       M14.5 13 H33.5 V25.5 H14.5 Z"
    fill="#FFFFFF"/>
</svg>
