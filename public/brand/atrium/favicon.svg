<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- PracticePro Atrium — THE BIG A (R47).
       Owner direction: "I don't like the favicon or even the icon for
       Atrium. For Atrium, I think it would look better if you look at
       the Practice Pro favicon. It looks much clearer. You can see what
       it is. There's a big P." The R39/R41 courtyard coin is
       retired — abstract geometry never read as fast as a letter. This
       is the company favicon's own formula, in Atrium's register: a
       full-bleed emerald tile (the bright emerald the owner approved
       for the tab in R41 — #10B981 lit toward #059669, so it reads
       clearly GREEN on light and dark browser chrome) with a bold white
       A. The company tile says P; the estate tile says A. -->
  <defs>
    <linearGradient id="at" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="10.5" fill="url(#at)"/>
  <!-- THE A — one bold geometric letterform, solid white, sized like the
       company favicon's big P: the letter spans 75% of the tile's width
       and 81% of its height; 8.5-unit legs (the P's own stem weight at
       tab scale); 6.5-unit crossbar; counter and notch stay legible at
       16px (VLM-verified). Identical geometry to the in-app AtriumMark. -->
  <path
    fill-rule="evenodd"
    d="M6 43.5 L21.5 4.5 H26.5 L42 43.5 H33.5 L31.1 37.5 H16.9 L14.5 43.5 Z
       M24 17 L28.5 31 H19.5 Z"
    fill="#FFFFFF"/>
</svg>
