<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- PracticePro Vega — the Night Chambers mark (R25, owner direction:
       "just choose yourself"): the same constructed V monogram with the
       star (Vega, brightest in Lyra) cut into its point as a diamond
       void, re-grounded in the live /vega page's design language — a
       gilt letterform on the night ground, the exact register of the
       page (gilt rules on near-black), replacing the garnet tile. -->
  <defs>
    <linearGradient id="vg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D111B"/>
      <stop offset="1" stop-color="#07090F"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="46" height="46" rx="11.5" fill="url(#vg)"/>
  <rect x="1" y="1" width="46" height="46" rx="11.5" fill="none" stroke="#D8B26C" stroke-opacity="0.5" stroke-width="1.5"/>
  <path fill-rule="evenodd" d="M11 13 H17.8 L24 26.03 L30.2 13 H37 L25.2 37.8 H22.8 Z M24 28.3 L26.9 31.9 L24 35.5 L21.1 31.9 Z" fill="#E9CD91"/>
</svg>
