<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- PracticePro Vega — the Seal mark (R26 construction, R60 colour).
       Vega is the brightest star in Lyra — the star navigators steered
       by. A solid coin (a notary seal) with the four-point steer-star
       cut through it in TRUE negative space: the disc carries 16px by
       mass, the star void carries the meaning. R60: the tile is the
       executive NAVY of the light-enterprise rebrand (#1E3A8A falling
       to the deep-navy corner) and the star is WHITE lit toward indigo
       (#C7D2FE) — the page's own navy-buttons-with-white-text pairing,
       at mark scale. The Warm Chambers burnt-orange register retires.
       Identical geometry to the in-app VegaMark. -->
  <defs>
    <linearGradient id="vg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="vsl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="46" height="46" rx="11.5" fill="url(#vg)"/>
  <rect x="1" y="1" width="46" height="46" rx="11.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>
  <path fill-rule="evenodd" d="M24 7 A17 17 0 1 0 24 41 A17 17 0 1 0 24 7 Z M24 12 L28.55 19.45 L36 24 L28.55 28.55 L24 36 L19.45 28.55 L12 24 L19.45 19.45 Z" fill="url(#vsl)"/>
</svg>
