    <style>
      /* ============================================================
         FOUNDER LOADING SCREEN — green → orange → black
         This is the standard splash for the Founder APK only.
         The consumer app (index.html) is completely untouched.
         ============================================================ */
      #founder-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #16A34A; /* GREEN — phase 1 */
        color: #000;
        font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
        animation: founderSplashBg 3.6s ease-in-out forwards;
        transition: opacity 420ms ease;
        overflow: hidden;
      }
      @keyframes founderSplashBg {
        0%   { background: #16A34A; }   /* GREEN  */
        45%  { background: #16A34A; }   /* hold green */
        55%  { background: #F97316; }   /* ORANGE — phase 2 */
        85%  { background: #F97316; }   /* hold orange */
        100% { background: #000000; }   /* BLACK — phase 3, founder brand */
      }
      /* Black logo mark — same proportions as the consumer icon, but
         rendered in BLACK as the standard for the Founder App. */
      #founder-splash .logo-mark {
        width: 84px;
        height: 84px;
        border-radius: 22px;
        background: #000;
        box-shadow: 0 8px 32px rgba(0,0,0,0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        animation: founderLogoPulse 1.8s ease-in-out infinite;
      }
      /* On the green phase, the black logo has a subtle white outline;
         on the black phase the outline fades so the logo blends with the
         black background (pure black-on-black with white "P"). */
      @keyframes founderLogoPulse {
        0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0.0); }
        50%      { transform: scale(1.04); box-shadow: 0 0 0 6px rgba(255,255,255,0.06); }
      }
      #founder-splash .logo-mark svg {
        width: 56px;
        height: 56px;
      }
      #founder-splash .brand {
        margin-top: 24px;
        font-weight: 800;
        letter-spacing: 0.02em;
        font-size: 22px;
        color: #000;
        opacity: 0.92;
        animation: founderBrandShift 3.6s ease-in-out forwards;
      }
      /* Brand text is black on green/orange, then flips to white on black
         so it stays legible in the final phase. */
      @keyframes founderBrandShift {
        0%, 85%  { color: #000000; }
        100%     { color: #FFFFFF; }
      }
      #founder-splash .ready-tag {
        margin-top: 10px;
        font-family: 'Space Grotesk', 'Inter', sans-serif;
        font-weight: 900;
        font-size: 28px;
        letter-spacing: 0.18em;
        color: #000;
        opacity: 0;
        transform: translateY(8px);
        animation: founderReadyReveal 3.6s ease-in-out forwards;
      }
      /* "FOUNDER" in BLACK — revealed in the final (black) phase.
         On the black background, "FOUNDER" sits inside a small white
         chip so the black text stays readable. */
      @keyframes founderReadyReveal {
        0%, 80% { opacity: 0; transform: translateY(8px); }
        100%    { opacity: 1; transform: translateY(0); }
      }
      #founder-splash .ready-tag .chip {
        display: inline-block;
        background: #FFFFFF;
        color: #000000;
        padding: 6px 14px;
        border-radius: 999px;
        font-size: 22px;
        letter-spacing: 0.22em;
      }
      #founder-splash .progress {
        position: absolute;
        bottom: 64px;
        width: 180px;
        height: 3px;
        background: rgba(0,0,0,0.18);
        border-radius: 999px;
        overflow: hidden;
      }
      #founder-splash .progress::after {
        content: "";
        display: block;
        height: 100%;
        width: 0%;
        background: #000;
        animation: founderProgress 3.6s ease-in-out forwards;
      }
      @keyframes founderProgress {
        0%   { width: 0%;   background: #000; }
        55%  { width: 55%;  background: #000; }
        85%  { width: 85%;  background: #000; }
        100% { width: 100%; background: #FFFFFF; }
      }
      /* When the React app mounts, it adds the .hidden class to fade out. */
      #founder-splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
