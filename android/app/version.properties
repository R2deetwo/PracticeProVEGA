# ─── PracticePro Semantic Versioning ──────────────────────────────────────
#
# Format: MAJOR.MINOR.PATCH (e.g., 1.2.3)
#
# MAJOR — Fundamental product changes (new product line, complete redesign).
#         Bump manually. Rarely changes.
#         1.x = PracticePro v1
#
# MINOR — Feature releases (new screens, new capabilities, significant UX).
#         Bump manually when you ship a batch of features.
#         1.0 = launch
#         1.1 = +retainer billing
#         1.2 = +billing monitor + unified financials
#         etc.
#
# PATCH — Bug fixes, small tweaks, UI polish.
#         CI AUTO-INCREMENTS this on every build. Do NOT edit manually
#         unless you're resetting after a minor bump.
#
# Android versionCode is computed as: MAJOR × 10000 + MINOR × 100 + PATCH
# This guarantees it always strictly increases and stays compact.
# Example: 1.2.3 → versionCode 10203
#
# ─── Current Version ──────────────────────────────────────────────────────
MAJOR=1
MINOR=0
# PATCH realigned to 792 on 2026-11-18: build-1190 shipped v1.0.792 but its
# bump commit lost the push race and never landed (root cause of the two
# identically-named v1.0.792 releases — build-1189 + build-1190). With PATCH
# still at 791, the next build would have produced a THIRD v1.0.792. Realigned
# so the next CI build bumps to 793 → v1.0.793 (versionCode 10793), strictly
# above the installed base (10792) and unambiguous vs the existing releases.
# PATCH=794 (2026-11-18 evening): this commit ships the native mic fix
# (MODIFY_AUDIO_SETTINGS + stock Capacitor permission client) as the sandbox
# APK v1.0.794 (versionCode 10794), strictly above the released 1.0.793.
PATCH=825
