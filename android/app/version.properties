# ─── PracticePro Semantic Versioning ──────────────────────────────────────
#
# Format: MAJOR.MINOR.PATCH (e.g., 1.2.3)
#
# MAJOR — Fundamental product changes (new product line, complete redesign).
#         Bump manually. Rarely changes.
#         1.x = PracticePro v1
#
# MINOR — Feature releases (new screens, new capabilities, significant UX).
#         Bump manually when you ship a batch of features.
#         1.0 = launch
#         1.1 = +retainer billing
#         1.2 = +billing monitor + unified financials
#         etc.
#
# PATCH — Bug fixes, small tweaks, UI polish.
#         CI AUTO-INCREMENTS this on every build. Do NOT edit manually
#         unless you're resetting after a minor bump.
#
# Android versionCode is computed as: MAJOR × 10000 + MINOR × 100 + PATCH
# This guarantees it always strictly increases and stays compact.
# Example: 1.2.3 → versionCode 10203
#
# ─── Current Version ──────────────────────────────────────────────────────
MAJOR=1
MINOR=0
PATCH=418
