apply plugin: 'com.android.application'

android {
    namespace = "com.practicepro.app"
    compileSdk = rootProject.ext.compileSdkVersion

    // TASK: Java 21 compatibility — required by Android Gradle Plugin 8.13+
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    // ─── Consistent Signing Configuration ────────────────────────────────
    // PROBLEM: Without a shared debug keystore, every CI build generates a
    // NEW random debug keystore, causing "App not installed as package
    // appears to be invalid" when installing a new APK over an existing one
    // (signature mismatch).
    //
    // FIX: We commit a project-local debug keystore (android/app/debug.keystore)
    // and reference it here. Both local builds and CI builds use the SAME
    // keystore, so the signature is consistent across all builds → the OS
    // treats successive APKs as valid updates instead of mismatches.
    //
    // The debug.keystore is generated with:
    //   keytool -genkey -v -keystore android/app/debug.keystore \
    //     -storepass android -alias androiddebugkey -keypass android \
    //     -keyalg RSA -keysize 2048 -validity 10000 \
    //     -dname "CN=PracticePro Debug, OU=Dev, O=PracticePro, L=Lagos, ST=Lagos, C=NG"
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId "com.practicepro.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        // ─── Semantic Version Code Computation ────────────────────────────
        // Reads MAJOR, MINOR, PATCH from version.properties and computes:
        //   versionCode = MAJOR × 10000 + MINOR × 100 + PATCH
        //   versionName = "MAJOR.MINOR.PATCH"
        //
        // This guarantees versionCode always strictly increases as PATCH
        // auto-increments in CI, while keeping the numbers compact.
        //
        // Example: 1.2.3 → versionCode 10203, versionName "1.2.3"
        def versionPropsFile = file('version.properties')
        def major = 1
        def minor = 0
        def patch = 0
        if (versionPropsFile.canRead()) {
            def versionProps = new Properties()
            versionProps.load(new FileInputStream(versionPropsFile))
            major = versionProps['MAJOR'].toInteger()
            minor = versionProps['MINOR'].toInteger()
            patch = versionProps['PATCH'].toInteger()
        }
        versionCode major * 10000 + minor * 100 + patch
        versionName "${major}.${minor}.${patch}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // TASK: Build a UNIVERSAL APK that includes ALL CPU architectures.
        // Without this, Gradle may produce architecture-specific APKs (arm64-v8a,
        // x86_64, etc.) that won't install on emulators like BlueStacks (which
        // uses x86/x86_64). The universal filter ensures one APK works everywhere.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }

        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#L61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            // Use the shared debug signingConfig so all builds (local + CI)
            // have the same signature — enables seamless APK updates.
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // For release builds, we'd use a release keystore stored as a
            // GitHub secret. For now, debug builds are what we ship for testing.
            signingConfig signingConfigs.debug
        }
    }

    // TASK: Generate a SINGLE universal APK (not per-architecture splits).
    // This ensures the APK installs on ALL devices and emulators including
    // BlueStacks (x86), real phones (ARM), and Android Studio emulator (x86_64).
    splits {
        abi {
            enable false
            universalApk true
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
