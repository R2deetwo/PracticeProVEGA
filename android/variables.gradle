    // App-module compile classpath for the Firebase Messaging classes used by
    // com.practicepro.app.push.PracticeProMessagingService / PushReplyReceiver.
    // The @capacitor/push-notifications plugin declares this as `implementation`,
    // which does NOT propagate to consumer modules — the app module must
    // declare it itself to compile against FirebaseMessagingService/RemoteMessage.
    // Must match the version the plugin resolves (its default is 25.0.1).
    firebaseMessagingVersion = '25.0.1'
