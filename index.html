<script>
  console.log("[index.html] Initializing head script...");
  // Apply theme classes before first paint to prevent FOUC
  (function() {
    try {
      var root = document.documentElement;
      const darkThemes = ['dark', 'midnight', 'oled', 'neon-cyber'];
      const lightThemes = ['light', 'sunlight-soft', 'city-lights'];
      const theme = localStorage.getItem('practicepro_theme') || 'system';

      if (theme === 'dark') {
          root.classList.add('dark');
      } else if (theme === 'midnight') {
          root.classList.add('dark', 'theme-midnight');
      } else if (theme === 'oled') {
          root.classList.add('dark', 'theme-oled');
      } else if (theme === 'neon-cyber') {
          root.classList.add('dark', 'theme-neon-cyber');
      } else if (theme === 'midnight-emerald') {
          root.classList.add('dark', 'theme-midnight-emerald');
      } else if (theme === 'army-dark') {
          root.classList.add('dark', 'theme-army-dark');
      } else if (theme === 'sunlight-soft') {
          root.classList.add('theme-sunlight-soft');
      } else if (theme === 'city-lights') {
          root.classList.add('theme-city-lights');
      } else if (theme === 'city-emerald') {
          root.classList.add('theme-city-emerald');
      } else if (theme === 'army-light') {
          root.classList.add('theme-army-light');
      } else if (theme === 'system') {
        if (window.matchMedia('(prefers-color-scheme: dark)').matches) { root.classList.add('dark'); }
      }
    } catch(e) {}
  })();
</script>
